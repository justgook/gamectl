<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Station Demo — one-room foundation</title>
  <style>
    :root { color-scheme: dark; font: 15px/1.4 system-ui, sans-serif; background:#07101a; color:#dcecff }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:18px }
    main { width:min(1100px,100%); display:grid; gap:12px }
    header, footer { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px }
    h1 { margin:0; font-size:1.2rem; letter-spacing:.08em; text-transform:uppercase }
    #stage { position:relative; aspect-ratio:16/9; border:1px solid #31455b; background:#07101a; box-shadow:0 18px 60px #0008 }
    canvas { width:100%; height:100%; display:block }
    .label { position:absolute; transform:translate(-50%,-50%); pointer-events:none; padding:2px 6px; border:1px solid #ffffff28; background:#07101acc; font-size:12px; font-weight:700; letter-spacing:.08em }
    #switch-label { left:26%; top:72% } #key-label { left:65%; top:27% } #exit-label { left:91%; top:50% }
    #complete { position:absolute; inset:0; display:none; place-items:center; background:#061018dd; font-size:clamp(24px,5vw,58px); font-weight:800; letter-spacing:.12em }
    #complete.visible { display:grid }
    #status { display:grid; grid-template-columns:repeat(3,minmax(120px,1fr)); gap:8px }
    .meter { border:1px solid #31455b; padding:8px 10px; background:#0c1724 }
    .meter b { float:right; color:#ff6d68 } .meter b.on { color:#55e695 }
    button { border:1px solid #58708a; color:#eaf4ff; background:#142337; padding:8px 13px; cursor:pointer }
    button:hover { background:#1b3150 }
    #message { min-height:1.5em; color:#9fc8ed }
    kbd { border:1px solid #53677b; border-radius:3px; padding:1px 5px; background:#132131 }
    @media (max-width:600px) { #status { grid-template-columns:1fr } .label { font-size:9px } }
  </style>
</head>
<body>
<main>
  <header><h1>Abandoned Station // Room 01</h1><span><kbd>WASD</kbd> move · <kbd>E</kbd>/<kbd>Space</kbd> interact · <kbd>R</kbd> restart</span></header>
  <section id="stage" aria-label="Playable top-down station room">
    <canvas id="canvas" tabindex="0"></canvas>
    <span id="switch-label" class="label">POWER SWITCH</span>
    <span id="key-label" class="label">ACCESS KEY</span>
    <span id="exit-label" class="label">EXIT</span>
    <div id="complete">STATION EXITED</div>
  </section>
  <section id="status" aria-live="polite">
    <span class="meter">Power <b id="power">OFFLINE</b></span>
    <span class="meter">Access key <b id="key">NOT HELD</b></span>
    <span class="meter">Exit <b id="exit">LOCKED</b></span>
  </section>
  <footer><span id="message">Reach an object and interact.</span><span><button id="interact">Interact</button> <button id="restart">Restart</button></span></footer>
</main>
<script type="module">
import {GLBridge} from './gl-bridge.js'

const canvas = document.querySelector('#canvas')
const statusEls = {power:document.querySelector('#power'),key:document.querySelector('#key'),exit:document.querySelector('#exit')}
const messageEl = document.querySelector('#message')
const completeEl = document.querySelector('#complete')
const actionForKey = new Map([
  ['KeyW',1],['ArrowUp',1],['KeyD',2],['ArrowRight',2],
  ['KeyS',3],['ArrowDown',3],['KeyA',4],['ArrowLeft',4],
  ['KeyE',5],['Space',5],['KeyR',6],
])
const messages = [
  'Reach an object and interact.', 'Power restored.', 'Access key recovered.',
  'Exit remains locked. The authored prerequisite is not met.',
  'Exit unlocked. Walk through the opening.', 'Room complete. Restart to replay.',
]
let instance, bridge, gl, eventPtr=0, frameCount=0, last=0, dt=1/60, raf=0
const down = new Set()
const offsets = {type:8,action:40,windowWidth:256,windowHeight:260,framebufferWidth:264,framebufferHeight:268}
const assetCache = new Map()

function readUtf8(ptr,len) { return new TextDecoder().decode(new Uint8Array(instance.exports.memory.buffer,ptr>>>0,len>>>0)) }
function writeU64(view,offset,value) { view.setUint32(offset,value>>>0,true); view.setUint32(offset+4,Math.floor(value/0x100000000)>>>0,true) }
function resize() {
  const dpr=Math.max(1,Math.min(devicePixelRatio||1,3)), w=Math.max(1,Math.floor(canvas.clientWidth*dpr)), h=Math.max(1,Math.floor(canvas.clientHeight*dpr))
  if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl?.viewport(0,0,w,h);dispatchResize()}
}
function eventBuffer() { return eventPtr||(eventPtr=Number(instance.exports.get_event_buffer())) }
function dispatch(type,action=0) {
  if(!instance)return
  const ptr=eventBuffer(), view=new DataView(instance.exports.memory.buffer)
  writeU64(view,ptr,frameCount++); view.setUint32(ptr+offsets.type,type,true); view.setUint32(ptr+offsets.action,action,true)
  instance.exports.event(ptr)
}
function dispatchResize(){
  if(!instance)return
  const ptr=eventBuffer(),view=new DataView(instance.exports.memory.buffer)
  writeU64(view,ptr,frameCount++);view.setUint32(ptr+offsets.type,14,true)
  view.setInt32(ptr+offsets.windowWidth,canvas.clientWidth,true);view.setInt32(ptr+offsets.windowHeight,canvas.clientHeight,true)
  view.setInt32(ptr+offsets.framebufferWidth,canvas.width,true);view.setInt32(ptr+offsets.framebufferHeight,canvas.height,true);instance.exports.event(ptr)
}
function action(code,isDown){
  if(isDown){if(down.has(code))return;down.add(code)}else{if(!down.delete(code))return}
  dispatch(isDown?100:101,code)
}
function pulse(code){action(code,true);action(code,false)}
function releaseHeldActions(){for(const code of [...down])action(code,false)}
function restart(){releaseHeldActions();pulse(6)}
function updateStatus(){
  const bits=Number(instance.exports.status_bits()), power=!!(bits&1), key=!!(bits&2), open=!!(bits&4), complete=!!(bits&8), message=(bits>>>8)&255
  statusEls.power.textContent=power?'ONLINE':'OFFLINE';statusEls.power.classList.toggle('on',power)
  statusEls.key.textContent=key?'HELD':'NOT HELD';statusEls.key.classList.toggle('on',key)
  statusEls.exit.textContent=open?'OPEN':'LOCKED';statusEls.exit.classList.toggle('on',open)
  document.querySelector('#key-label').hidden=key;completeEl.classList.toggle('visible',complete);messageEl.textContent=messages[message]??'Invalid game status'
}
async function boot(){
  gl=canvas.getContext('webgl2',{alpha:false,depth:true,stencil:true,antialias:true,premultipliedAlpha:false})
  if(!gl)throw new Error('WebGL2 is required')
  resize()
  const packResponse=await fetch('./station.rspk');if(!packResponse.ok)throw new Error(`station.rspk: ${packResponse.status}`)
  assetCache.set('station.rspk',new Uint8Array(await packResponse.arrayBuffer()))
  bridge=new GLBridge(gl,null)
  const wasmBytes=await fetch('./station-demo.wasm').then(r=>{if(!r.ok)throw new Error(`station-demo.wasm: ${r.status}`);return r.arrayBuffer()})
  const imports={env:{
    js_canvas_width:()=>canvas.width,js_canvas_height:()=>canvas.height,js_webgl_framebuffer:()=>0,js_frame_duration:()=>dt,
    cos:Math.cos,sin:Math.sin,powf:Math.pow,
    js_log:(level,tp,tl,mp,ml)=>console[level>=3?'error':level===2?'warn':'info'](`[${readUtf8(tp,tl)}]`,readUtf8(mp,ml)),
    game_asset_size:(p,l)=>assetCache.get(readUtf8(p,l))?.byteLength??-1,
    game_asset_read:(p,l,dst,cap)=>{const b=assetCache.get(readUtf8(p,l));if(!b||cap<b.byteLength)return-1;new Uint8Array(instance.exports.memory.buffer,dst,b.byteLength).set(b);return b.byteLength},
    ...bridge.createImportObject(),glGetString:()=>0,glGetStringi:()=>0,
  }}
  instance=(await WebAssembly.instantiate(wasmBytes,imports)).instance;bridge.memory=instance.exports.memory;instance.exports.init();dispatchResize();canvas.focus()
  const tick=time=>{raf=requestAnimationFrame(tick);dt=last?Math.min((time-last)/1000,.05):1/60;last=time;instance.exports.frame();updateStatus()};raf=requestAnimationFrame(tick)
}
window.addEventListener('keydown',e=>{const a=actionForKey.get(e.code);if(!a)return;e.preventDefault();if(a===6){if(!e.repeat)restart();return}action(a,true)})
window.addEventListener('keyup',e=>{const a=actionForKey.get(e.code);if(!a)return;e.preventDefault();if(a!==6)action(a,false)})
window.addEventListener('blur',releaseHeldActions)
document.querySelector('#interact').addEventListener('click',()=>pulse(5));document.querySelector('#restart').addEventListener('click',restart)
new ResizeObserver(resize).observe(canvas);boot().catch(error=>{console.error(error);messageEl.textContent=`Startup failed: ${error.message}`})
</script>
</body>
</html>
