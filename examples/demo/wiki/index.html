<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Game design documentation and project knowledge base">
  <title>Game Wiki</title>
  <link rel="stylesheet" href="vendor/highlight-github-dark.min.css">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="character-card.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-button sidebar-toggle" id="sidebar-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">☰</button>
    <a class="brand" id="brand" href="#/home">Game Wiki</a>
    <span class="document-kind">Design documentation</span>
  </header>

  <div class="docs-shell">
    <aside class="sidebar" id="sidebar">
      <label class="filter">
        <span>Filter pages</span>
        <input id="nav-filter" type="search" placeholder="Type to filter…" autocomplete="off">
      </label>
      <nav class="tree" id="tree" aria-label="Documentation">
        <div class="loading">Loading navigation…</div>
      </nav>
    </aside>

    <main class="main" id="main">
      <article class="article" id="article">
        <div class="loading">Loading page…</div>
      </article>
      <nav class="page-pagination" id="page-pagination" aria-label="Adjacent pages"></nav>
    </main>

    <aside class="outline" id="outline" aria-label="On this page">
      <strong>On this page</strong>
      <nav id="outline-links"></nav>
    </aside>
  </div>

  <script src="vendor/js-yaml.min.js"></script>
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/marked-footnote.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script src="vendor/katex/katex.min.js"></script>
  <script src="vendor/marked-katex.min.js"></script>
  <script src="vendor/mermaid.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
