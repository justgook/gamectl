<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GAMS Browser2</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #111318;
        color: #e7ebf3;
      }
      main {
        width: min(760px, calc(100vw - 48px));
        padding: 32px;
        border: 1px solid #2a3140;
        border-radius: 16px;
        background: #171b23;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }
      p, li {
        line-height: 1.5;
        color: #c6cfdd;
      }
      code {
        background: #0f1218;
        padding: 2px 6px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>GAMS Browser2</h1>
      <p>Fresh browser host entrypoint for the new JS/WASM plugin architecture migration.</p>
      <ul>
        <li>Server/bootstrap intentionally mirrors <code>cmd/browser</code>.</li>
        <li>UI is a placeholder for now.</li>
        <li>Next step is incremental migration of routed JS and WASM plugins.</li>
      </ul>
    </main>
  </body>
</html>
