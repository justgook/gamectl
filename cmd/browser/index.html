<!DOCTYE html>
  <html lang="en">

  <head>
    <meta charset="UTF-8" />

    <title>Nested Web Components Example</title>
    <link rel="icon" href="/favicon.svg">
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="base.css">

  <body>
    <!-- Splash Screen - renders immediately before app boot completes -->
    <splash-screen id="splash-screen"></splash-screen>

    <toast-manager>

        <layout-manager><view-stb-editor></view-stb-editor><view-nodegraph2

      </popup-manager>
    </toast-manager>
    <script src="coi-serviceworker.js"></script>
    <script type="module" src="/splash-screen.js"></script>
    <script type="module" src="/app.js"></script>
