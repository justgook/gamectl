<!DOCTYE html>
  <html lang="en">

  <head>
    <meta charset="UTF-8" />

    <title>Nested Web Components Example</title>
    <link rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="/tokens/css/variables.css">
    <link rel="stylesheet" href="/tokens/css/atomic.css">
    <link rel="stylesheet" href="/tokens/css/components.css">
    <link rel="stylesheet" href="app.css">
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet">
  </head>

  <body>
    <template id="view-empty">
      <div style="padding: var(--spacing-scale-3);">Empty panel</div>
    </template>
    <template id="view-testing">
      <div style="display: flex; flex-direction: column; gap: var(--spacing-scale-2); padding: var(--spacing-scale-3);">
        <button type="button" onclick="console.log('[Plugin] hello world')">Call log</button>
        <button class="button-secondary" type="button"
          onclick="this.closest('view-testing').generateWorldgraph()">Create
          world tree</button>
        <button class="button-secondary" type="button" onclick="this.closest('view-testing').assignBiomeNames()">Set
          biome
          names</button>
        <button class="button-secondary" type="button" onclick="this.closest('view-testing').getTree()">Get world
          tree</button>
        <button class="button-secondary" type="button" onclick="this.closest('view-testing').createMinimap()">Create
          minimap</button>
        <button class="button-secondary" type="button" onclick="this.closest('view-testing').getMinimap()">Get
          minimap</button>
      </div>
    </template>

    <template id="view-pipeline">
      <div style="display: flex; flex-direction: column; gap: var(--spacing-scale-3); padding: var(--spacing-scale-3);">
        <details>
          <summary>1. Create World Tree</summary>
          <form name="tree"
            style="display: flex; flex-direction: column; gap: var(--spacing-scale-2); padding: var(--spacing-scale-3);">
            <label>Node Count: <span>10</span> <input type="range" name="nodeCount" min="5" max="100" value="10"
                oninput="this.previousElementSibling.textContent=this.value"></label>
            <label>Max Depth: <span>0</span> <input type="range" name="maxDepth" min="0" max="10" value="0"
                oninput="this.previousElementSibling.textContent=this.value"></label>
            <label>Max Branching: <span>0</span> <input type="range" name="maxBranching" min="0" max="10" value="0"
                oninput="this.previousElementSibling.textContent=this.value"></label>
            <label>Root Branches: <span>0</span> <input type="range" name="rootBranches" min="0" max="20" value="0"
                oninput="this.previousElementSibling.textContent=this.value"></label>
            <label>Output Name: <input type="text" name="treeId" value="progression"></label>
            <button type="submit">Generate Tree</button>
          </form>
        </details>
        <details>
          <summary>2. Assign Biomes</summary>
          <form name="biomes"
            style="display: flex; flex-direction: column; gap: var(--spacing-scale-2); padding: var(--spacing-scale-3);">
            <label>Tree ID: <input type="text" name="treeId" value="progression"></label>
            <label>Biomes Query: <input type="text" name="biomesQuery" value="SELECT name FROM biomes ORDER BY RANDOM()"
                style="width: 100%;"></label>
            <button type="submit">Assign Biomes</button>
          </form>
        </details>
        <details>
          <summary>3. Assign Keys & Locks</summary>
          <form name="keylock"
            style="display: flex; flex-direction: column; gap: var(--spacing-scale-2); padding: var(--spacing-scale-3);">
            <label>Tree ID: <input type="text" name="treeId" value="progression"></label>
            <label>Keys Query: <input type="text" name="keysQuery"
                value="SELECT name FROM keys ORDER BY RANDOM() LIMIT 15" style="width: 100%;"></label>
            <label>Key Chance: <span>0.5</span> <input type="range" name="keyChance" min="0" max="1" step="0.1"
                value="0.5" oninput="this.previousElementSibling.textContent=this.value"></label>
            <label>Lock Chance: <span>0.7</span> <input type="range" name="lockChance" min="0" max="1" step="0.1"
                value="0.7" oninput="this.previousElementSibling.textContent=this.value"></label>
            <label>Max Keys Per Lock: <span>2</span> <input type="range" name="maxKeysPerLock" min="1" max="5" value="2"
                oninput="this.previousElementSibling.textContent=this.value"></label>
            <button type="submit">Assign Keys & Locks</button>
          </form>
        </details>
        <details open>
          <summary>4. Create Minimap</summary>
          <form name="minimap"
            style="display: flex; flex-direction: column; gap: var(--spacing-scale-2); padding: var(--spacing-scale-3);">
            <label>Input Tree: <input type="text" name="inputTreeId" value="progression"></label>
            <label>Output Map: <input type="text" name="mapId" value="new_map"></label>
            <label>Layout Direction:
              <select name="direction">
                <option value="radial" selected>Radial</option>
                <option value="topDown">Top Down</option>
                <option value="bottomUp">Bottom Up</option>
                <option value="leftToRight">Left to Right</option>
                <option value="rightToLeft">Right to Left</option>
                <option value="directional">Directional</option>
              </select>
            </label>
            <button type="submit">Generate Minimap</button>
          </form>
        </details>
        <details>
          <summary>5. Apply Automap Rules</summary>
          <form name="automap"
            style="display: flex; flex-direction: column; gap: var(--spacing-scale-2); padding: var(--spacing-scale-3);">
            <label>Rules Map: <input type="text" name="rulesMapId" value="rules"></label>
            <label>Input Map: <input type="text" name="inputMapId" value="new_map"></label>
            <label>Output Map: <input type="text" name="outputMapId" value="automap_result"></label>
            <button type="submit">Apply Automap</button>
          </form>
        </details>
      </div>
    </template>

    <template id="view-splitter">
      <div style="display: flex; gap: var(--spacing-scale-3); padding: var(--spacing-scale-3);">
        <button type="button" data-action="split-vertical">Vertical</button>
        <button class="button-secondary" type="button" data-action="split-horizontal">Horizontal</button>
      </div>
    </template>

    <template id="view-console">
      <pre data-element="log-output"
        style="white-space: pre-wrap; font-family: 'Roboto Mono', monospace; font-size: var(--font-size-sm); line-height: 1.4; padding: var(--spacing-scale-3); margin: 0; width: 100%; height: 100%; overflow: auto;">
      </pre>
    </template>

    <template id="view-sql-console">
      <div data-element="output"
        style="flex: 1; overflow: auto; padding: var(--spacing-scale-3); background: var(--color-semantic-bg-primary);">
      </div>
      <div
        style="display: flex; align-items: flex-start; padding: var(--spacing-scale-2); border-top: 1px solid var(--color-semantic-border-default); background: var(--color-semantic-bg-secondary);">
        <span
          style="color: var(--color-semantic-text-accent); font-family: 'Roboto Mono', monospace; font-size: var(--font-size-sm); padding: 8px 4px 8px 8px;">></span>
        <textarea data-element="input" placeholder="SELECT * FROM sqlite_schema;" rows="1"
          style="flex: 1; background: transparent; border: none; outline: none; color: var(--color-semantic-text-primary); font-family: 'Roboto Mono', monospace; font-size: var(--font-size-sm); resize: none; padding: 8px; line-height: 1.4; min-height: 24px; field-sizing: content;"></textarea>
      </div>
    </template>

    <template id="view-sql-table">
      <div data-element="toolbar" class="sql-table-toolbar">
        <button data-action="refresh" class="button-secondary" title="Refresh (Ctrl+R)">Refresh</button>
        <button data-action="insert" class="button-secondary" title="Insert Row (Insert)">+ Row</button>
      </div>
      <div data-element="table-container" class="sql-table-container"></div>
      <div class="sql-table-footer">
        <div data-element="pagination" class="sql-table-pagination"></div>
        <div data-element="status" class="sql-table-status"></div>
      </div>
    </template>

    <template id="view-files">
      <div data-element="toolbar" class="files-toolbar">
        <button data-action="refresh" class="button-secondary" title="Refresh">Refresh</button>
        <button data-action="new-file" class="button-secondary" title="New File">+ File</button>
        <button data-action="new-folder" class="button-secondary" title="New Folder">+ Folder</button>
        <button data-action="delete" class="button-secondary" title="Delete">Delete</button>
        <span class="files-path" data-element="path-display">/</span>
      </div>
      <div data-element="tree-container" class="files-tree-container">
        <table class="files-tree">
          <thead>
            <tr>
              <th class="files-col-name">Name</th>
              <th class="files-col-modified">Date Modified</th>
              <th class="files-col-size">Size</th>
              <th class="files-col-kind">Kind</th>
            </tr>
          </thead>
          <tbody data-element="tree-body"></tbody>
        </table>
      </div>
      <div data-element="status" class="files-status"></div>
      <div data-element="modal" class="files-modal" style="display: none;">
        <div class="files-modal-backdrop"></div>
        <div class="files-modal-content">
          <div class="files-modal-header">
            <span class="files-modal-title" data-element="modal-title">File</span>
            <button class="files-modal-close" data-action="modal-close">&times;</button>
          </div>
          <div class="files-modal-body" data-element="modal-body"></div>
          <div class="files-modal-footer" data-element="modal-footer"></div>
        </div>
      </div>
    </template>

    <!-- Canvas views (nodegraph, tilemap, tree) create their content programmatically -->
    <template id="view-tilemap">
      <div slot="header-controls" class="view-header-controls">
        <input type="number" data-action="tile-value" value="1" min="0"
          style="width: 32px; height: 32px; text-align: center; padding: 0; border: 2px solid var(--color-semantic-border-interactive); border-radius: var(--border-radius-sm); background: var(--color-semantic-bg-secondary); color: var(--color-semantic-text-primary);">
        <button data-action="save" class="button-primary">💾 Save</button>
        <button data-action="reload" class="button-secondary">🔄 Reload</button>
        <button data-action="zoom-in" class="button-secondary">+</button>
        <button data-action="zoom-out" class="button-secondary">−</button>
        <button data-action="zoom-fit" class="button-secondary">⊡ Fit</button>
      </div>
    </template>

    <template id="view-nodegraph">
      <div slot="header-controls" class="view-header-controls">
        <button data-action="add-node">+ Node</button>
        <button data-action="run" class="button-success">▶ Run</button>
        <button data-action="save" class="button-primary">💾 Save</button>
        <button data-action="reload" class="button-secondary">🔄 Reload</button>
        <button data-action="zoom-in" class="button-secondary">+</button>
        <button data-action="zoom-out" class="button-secondary">−</button>
        <button data-action="zoom-fit" class="button-secondary">⊡ Fit</button>
      </div>
    </template>

    <template id="view-tree">
      <div slot="header-controls" class="view-header-controls">
        <button data-action="save" class="button-primary">💾 Save</button>
        <button data-action="reload" class="button-secondary">🔄 Reload</button>
        <button data-action="zoom-in" class="button-secondary">+</button>
        <button data-action="zoom-out" class="button-secondary">−</button>
        <button data-action="zoom-fit" class="button-secondary">⊡ Fit</button>
      </div>
    </template>

    <template id="view-skeleton">
      <div slot="header-controls" class="view-header-controls">
        <select data-action="pose-select" class="toolbar-select" title="Select Pose">
          <option value="default">default</option>
        </select>
        <button data-action="pose-save" class="button-secondary" title="Save Pose">Save Pose</button>
        <button data-action="pose-new" class="button-secondary" title="Save as New Pose">+ Pose</button>
        <button data-action="pose-reset" class="button-secondary" title="Reset to Saved Pose">Reset</button>
        <span class="toolbar-divider"></span>
        <button data-action="add-bone" class="button-secondary">+ Bone</button>
        <button data-action="toggle-labels" class="button-secondary">Labels</button>
        <span class="toolbar-divider"></span>
        <button data-action="save" class="button-primary" title="Save Skeleton">Save</button>
        <button data-action="reload" class="button-secondary">Reload</button>
        <button data-action="zoom-in" class="button-secondary">+</button>
        <button data-action="zoom-out" class="button-secondary">-</button>
        <button data-action="zoom-fit" class="button-secondary">Fit</button>
      </div>
    </template>

    <template id="view-timeline">
      <div slot="header-controls" class="view-header-controls">
        <button data-action="play" class="button-secondary">▶ Play</button>
        <button data-action="stop" class="button-secondary">◼ Stop</button>
        <span class="toolbar-divider"></span>
        <button data-action="add-key" class="button-secondary">+ Key</button>
        <button data-action="delete-key" class="button-secondary">Delete</button>
        <span class="toolbar-divider"></span>
        <label class="toolbar-checkbox">
          <input type="checkbox" data-action="loop">
          Loop
        </label>
        <span class="toolbar-divider"></span>
        <span data-element="time-display" class="time-display">0.00s</span>
      </div>
    </template>

    <template id="view-opr-unit-builder">
      <div slot="header-controls" class="view-header-controls">
        <button data-action="random-unit" class="button-secondary">🎲 Random Unit</button>
        <button data-action="export-json" class="button-primary">📋 Export JSON</button>
      </div>
      <div
        style="display: flex; flex-direction: column; gap: var(--spacing-scale-3); padding: var(--spacing-scale-3); height: 100%; overflow: auto;">
        <!-- Universe/Army/Unit Selectors -->
        <div style="display: flex; gap: var(--spacing-scale-2); flex-wrap: wrap;">
          <label style="display: flex; flex-direction: column; gap: var(--spacing-scale-1); flex: 1; min-width: 150px;">
            <span style="font-weight: 500; color: var(--color-semantic-text-secondary);">Universe</span>
            <select data-select="universe"
              style="padding: var(--spacing-scale-2); border: 1px solid var(--color-semantic-border-default); border-radius: var(--border-radius-sm); background: var(--color-semantic-bg-secondary); color: var(--color-semantic-text-primary); font-size: var(--font-size-md);">
              <option value="">-- Select Universe --</option>
            </select>
          </label>
          <label style="display: flex; flex-direction: column; gap: var(--spacing-scale-1); flex: 1; min-width: 150px;">
            <span style="font-weight: 500; color: var(--color-semantic-text-secondary);">Army</span>
            <select data-select="army" disabled
              style="padding: var(--spacing-scale-2); border: 1px solid var(--color-semantic-border-default); border-radius: var(--border-radius-sm); background: var(--color-semantic-bg-secondary); color: var(--color-semantic-text-primary); font-size: var(--font-size-md);">
              <option value="">-- Select Army --</option>
            </select>
          </label>
          <label style="display: flex; flex-direction: column; gap: var(--spacing-scale-1); flex: 1; min-width: 150px;">
            <span style="font-weight: 500; color: var(--color-semantic-text-secondary);">Unit</span>
            <select data-select="unit" disabled
              style="padding: var(--spacing-scale-2); border: 1px solid var(--color-semantic-border-default); border-radius: var(--border-radius-sm); background: var(--color-semantic-bg-secondary); color: var(--color-semantic-text-primary); font-size: var(--font-size-md);">
              <option value="">-- Select Unit --</option>
            </select>
          </label>
        </div>

        <!-- Unit Display Area -->
        <div data-element="unit-display" style="display: none; flex-direction: column; gap: var(--spacing-scale-3);">
          <!-- Unit Header -->
          <div
            style="background: var(--color-semantic-bg-tertiary); padding: var(--spacing-scale-3); border-radius: var(--border-radius-md); border-left: 4px solid var(--color-semantic-border-accent);">
            <h2 data-element="unit-name"
              style="margin: 0 0 var(--spacing-scale-2) 0; font-size: var(--font-size-xl); color: var(--color-semantic-text-primary);">
            </h2>
            <div
              style="display: flex; gap: var(--spacing-scale-4); flex-wrap: wrap; font-size: var(--font-size-sm); color: var(--color-semantic-text-secondary);">
              <div><strong>Size:</strong> <span data-element="unit-size"></span></div>
              <div><strong>Cost:</strong> <span data-element="unit-cost"></span>pts</div>
              <div><strong>Quality:</strong> <span data-element="unit-quality"></span>+</div>
              <div><strong>Defense:</strong> <span data-element="unit-defense"></span>+</div>
              <div><strong>Type:</strong> <span data-element="unit-type"></span></div>
            </div>
          </div>

          <!-- Special Rules -->
          <div data-element="special-rules-container" style="display: none;">
            <h3
              style="margin: 0 0 var(--spacing-scale-2) 0; font-size: var(--font-size-lg); color: var(--color-semantic-text-primary);">
              Special Rules</h3>
            <div data-element="special-rules" style="display: flex; gap: var(--spacing-scale-2);"></div>
          </div>

          <!-- Weapons -->
          <div data-element="weapons-container" style="display: none;">
            <h3
              style="margin: 0 0 var(--spacing-scale-2) 0; font-size: var(--font-size-lg); color: var(--color-semantic-text-primary);">
              Weapons</h3>
            <div data-element="weapons" style="display: flex; flex-direction: column; gap: var(--spacing-scale-2);">
            </div>
          </div>

          <!-- Upgrades -->
          <div data-element="upgrades-container" style="display: none;">
            <h3
              style="margin: 0 0 var(--spacing-scale-2) 0; font-size: var(--font-size-lg); color: var(--color-semantic-text-primary);">
              Available Upgrades</h3>
            <div data-element="upgrades" style="display: flex; flex-direction: column; gap: var(--spacing-scale-2);">
            </div>
          </div>

          <!-- Total Cost -->
          <div
            style="background: var(--color-semantic-bg-tertiary); padding: var(--spacing-scale-3); border-radius: var(--border-radius-md); margin-top: auto;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <strong style="font-size: var(--font-size-lg);">Total Cost:</strong>
              <strong data-element="total-cost"
                style="font-size: var(--font-size-xl); color: var(--color-semantic-text-accent);">0pts</strong>
            </div>
          </div>
        </div>

        <!-- Empty State -->
        <div data-element="empty-state"
          style="flex: 1; display: flex; align-items: center; justify-content: center; color: var(--color-semantic-text-tertiary); font-size: var(--font-size-lg);">
          Select a universe, army, and unit to begin
        </div>
      </div>
    </template>

    <template id="view-handle">
      <div data-action="resize" class="handle"></div>
    </template>

    <template id="chrome-template">
      <link rel="stylesheet" href="reset.css">
      <link rel="stylesheet" href="/tokens/css/variables.css">
      <link rel="stylesheet" href="/tokens/css/atomic.css">
      <link rel="stylesheet" href="/tokens/css/components.css">
      <link rel="stylesheet" href="app.css">

      <div class="panel">
        <div class="panel-header">

          <select name="view" data-action="select-view" class="view-selector">
            <optgroup label="Canvas">
              <option value="view-nodegraph">Node Graph</option>
              <option value="view-tree">Tree View</option>
              <option value="view-tilemap">Tilemap</option>
              <option value="view-skeleton">Skeleton</option>
              <option value="view-timeline">Timeline</option>
            </optgroup>
            <optgroup label="OPR">
              <option value="view-opr-unit-builder">Unit Builder</option>
            </optgroup>
            <optgroup label="Data">
              <option value="view-sql-table" data-config="items">Items Table</option>
              <option value="view-sql-table" data-config="biomes">Biomes Table</option>
            </optgroup>
            <optgroup label="Utilities">
              <option value="view-console">Console</option>
              <option value="view-sql-console">SQL Console</option>
              <option value="view-files">File Browser</option>
              <option value="view-empty">Empty</option>
              <option value="view-testing">Testing</option>
              <option value="view-pipeline">Pipeline</option>
            </optgroup>
          </select>
          <div class="panel-header-controls">
            <slot name="header-controls"></slot>
          </div>
        </div>
        <div class="panel-content" data-element="content">
          <slot></slot>
        </div>
        <!-- Corner handles -->
        <div class="ne corner-handle corner-handle-ne" data-action="ne" draggable="true"></div>
        <div class="se corner-handle corner-handle-se" data-action="se" draggable="true"></div>
        <div class="sw corner-handle corner-handle-sw" data-action="sw" draggable="true"></div>
        <div class="nw corner-handle corner-handle-nw" data-action="nw" draggable="true"></div>
      </div>
    </template>

    <!-- Popup System Templates -->
    <template id="popup-template">
      <link rel="stylesheet" href="reset.css">
      <link rel="stylesheet" href="/tokens/css/variables.css">
      <link rel="stylesheet" href="/tokens/css/atomic.css">
      <link rel="stylesheet" href="/tokens/css/components.css">
      <link rel="stylesheet" href="app.css">

      <div class="popup-backdrop">
        <div class="popup-container">
          <div class="popup-header">
            <slot name="title"></slot>
            <div class="popup-header-controls">
              <slot name="header-controls"></slot>
            </div>
            <button class="popup-close" type="button" data-action="close" aria-label="Close popup">×</button>
          </div>
          <div class="popup-content">
            <slot></slot>
          </div>
        </div>
      </div>
    </template>

    <!-- Toast System Templates -->
    <template id="toast-container">
      <div class="toast-container">
        <span class="toast-message" data-element="message"></span>
        <button class="toast-close" data-action="close" aria-label="Close">×</button>
      </div>
    </template>

    <template id="toast-container-alert">
      <div class="toast-container toast-container-alert">
        <span class="toast-message" data-element="message"></span>
        <div class="toast-actions">
          <button class="toast-button toast-button-primary" data-action="confirm"
            data-element="confirm-button">OK</button>
        </div>
      </div>
    </template>

    <template id="toast-container-confirm">
      <div class="toast-container toast-container-confirm">
        <span class="toast-message" data-element="message"></span>
        <div class="toast-actions">
          <button class="toast-button" data-action="cancel" data-element="cancel-button">Cancel</button>
          <button class="toast-button toast-button-primary" data-action="confirm"
            data-element="confirm-button">Confirm</button>
        </div>
      </div>
    </template>

    <!-- Node Code Editor Popup Template -->
    <template id="popup-node-code">
      <div style="display: flex; flex-direction: column; gap: var(--spacing-scale-2);">
        <div style="font-size: var(--font-size-sm); color: var(--color-semantic-text-secondary); padding: var(--spacing-scale-2); background: var(--color-semantic-bg-secondary); border-radius: var(--border-radius-sm);">
          <strong>Inputs ($in):</strong> <span data-element="inputs-info">none</span><br>
          <strong>Outputs ($out):</strong> <span data-element="outputs-info">none</span>
        </div>
        <textarea data-element="code-editor" spellcheck="false" placeholder="// Write your code here&#10;// Access inputs via $in.name&#10;// Set outputs via $out.name = value"
          style="width: 100%; min-height: 300px; font-family: monospace; font-size: 14px; padding: var(--spacing-scale-2); border: 1px solid var(--color-semantic-border-default); border-radius: var(--border-radius-sm); background: var(--color-semantic-bg-primary); color: var(--color-semantic-text-primary); resize: vertical; tab-size: 2;"></textarea>
