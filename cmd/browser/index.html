<!DOCTYE html>
  <html lang="en">

  <head>
    <meta charset="UTF-8" />

    <title>Nested Web Components Example</title>
    <link rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="build.nosync/tokens/css/variables.css">
    <link rel="stylesheet" href="build.nosync/tokens/css/atomic.css">
    <link rel="stylesheet" href="build.nosync/tokens/css/components.css">
    <link rel="stylesheet" href="app.css">
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet">
  </head>

  <body>

    <template id="view-empty">
      <div class="panel">
        <div class="panel-header">Empty</div>
        <div class="panel-content">Empty panel</div>
      </div>
    </template>
    <template id="view-testing">
      <div class="panel">
        <div class="panel-header">Testing Panel</div>
        <div class="panel-content" style="display: flex; flex-direction: column;">
          <button class="button-primary" type="button" onclick="pluginManager.call('host', 'log', 'hello world')">call
            log</button>
          <button class="button-secondary" type="button" onclick="this.closest('[panel]').generateWorldgraph()">Create
            world graph</button>
          <button class="button-secondary" type="button" onclick="this.closest('[panel]').getTree()">Get World
            tree</button>
          <button class="button-secondary" type="button" onclick="this.closest('[panel]').getTreeJSON()">Get Tree
            JSON</button>
          <button class="button-secondary" type="button" onclick="this.closest('[panel]').createMinimap()">Create
            minimap</button>
          <button class="button-secondary" type="button" onclick="this.closest('[panel]').getMinimap()">Get
            minimap</button>
        </div>
      </div>
    </template>

    <template id="view-splitter">
      <div class="panel">
        <div class="panel-header">Splitter</div>
        <div class="panel-content">
          <button class="button-primary" type="button" data-action="split-vertical">Vertical</button>
          <button class="button-secondary" type="button" data-action="split-horizontal">Horizontal</button>
        </div>
      </div>
    </template>

    <template id="view-console">
      <div class="panel">
        <div class="panel-header">Console</div>
        <div class="panel-content">
          <pre data-element="log-output" style="white-space: pre-wrap;"></pre>
        </div>
      </div>
    </template>

    <template id="view-minimap">
      <div class="panel">
        <div class="panel-header">Minimap</div>
        <div class="panel-content" style="padding: 0;">
          <canvas></canvas>
          <div
            style="position: absolute; top: 10px; right: 10px; z-index: 100; display: flex; gap: 8px; padding: 8px; background: rgba(0, 0, 0, 0.5); border-radius: 4px;">
            <button data-action="reload" class="button-secondary">🔄 Reload</button>
            <button data-action="zoom-in" class="button-secondary">+</button>
            <button data-action="zoom-out" class="button-secondary">−</button>
            <button data-action="zoom-fit" class="button-secondary">⊡ Fit</button>
          </div>
          <div class="tooltip" data-tooltip></div>
        </div>
      </div>
    </template>

    <template id="view-tree">
      <div class="panel">
        <div class="panel-header">Minimap</div>
        <div class="panel-content" style="padding: 0;">
          <canvas></canvas>
          <div
            style="position: absolute; top: 10px; right: 10px; z-index: 100; display: flex; gap: 8px; padding: 8px; background: rgba(0, 0, 0, 0.5); border-radius: 4px;">
            <button data-action="reload" class="button-secondary">🔄 Reload</button>
            <button data-action="zoom-in" class="button-secondary">+</button>
            <button data-action="zoom-out" class="button-secondary">−</button>
            <button data-action="zoom-fit" class="button-secondary">⊡ Fit</button>
          </div>
          <div class="tooltip" data-tooltip></div>
        </div>
      </div>
    </template>

    <template id="view-handle">
      <div data-action="resize" class="handle" draggable="true">handle</div>
    </template>

    <template id="view-chrome">
      <div class="panel-header" style="background-color: transparent; padding-left: var(--panel-header-padding);">
        <select class="select" data-action="select-view">
          <option value="view-splitter">view-splitter</option>
          <option value="view-testing">view-testing</option>
          <option value="view-minimap">view-minimap</option>
          <option value="view-tree">view-tree</option>
          <option value="view-empty">view-empty</option>
          <option value="view-console">view-console</option>
        </select>
      </div>
      <div class="ne" data-action="ne" draggable="true"></div>
      <div class="se" data-action="se" draggable="true"></div>
      <div class="sw" data-action="sw" draggable="true"></div>
      <div class="nw" data-action="nw" draggable="true"></div>
    </template>

    <layout-parent handle-width="6" handle-height="20" id="scene">
      <view-minimap panel="panel_1"></view-minimap>
      <view-console nesw="s" r="200" from="panel_1"></view-console>
      <view-testing nesw="w" r="200" from="panel_1"></view-testing>
    </layout-parent>


    <script src="./plugin-manager.js"> </script>
    <script type="module">
      import {LayoutParent} from "./views/layout.js"
      import {ViewCanvasBase} from "./views/view-canvas-base.js"
      import {ViewEmpty} from "./views/view-empty.js"
      import {ViewTesting} from "./views/view-testing.js"
      import {ViewSplitter} from "./views/view-splitter.js"
      import {ViewMinimap} from "./views/view-minimap.js"
      import {ViewTree} from "./views/view-tree.js"
      import {ViewConsole} from "./views/view-console.js"
      // import {bus} from "./systems/event-bus.js"
      // window.bus = bus

      customElements.define('layout-parent', LayoutParent)
      customElements.define('view-empty', ViewEmpty)
      customElements.define('view-testing', ViewTesting)
      customElements.define('view-splitter', ViewSplitter)
      customElements.define('view-minimap', ViewMinimap)
      customElements.define('view-tree', ViewTree)
      customElements.define('view-console', ViewConsole)


      /// THE PLUGIN MANAGER TESTING!!!
      const pluginNames = [
        'random',
        'tree-storage',
        'worldgraph',
        'minimap',
        'tilemap-storage',
        'automap',
        // THE NEW stuff
        'tree-storage2',
        'treegen',
      ];

      // Create modules array for plugin manager
      const modules = pluginNames.map(name => ({
        name: name,
        url: `/build.nosync/${name}.wasm`
      }))

      window.pluginManager = await PluginManager.create({
        modules: modules,
        hostFunctions: [
          {
            module: 'host',
            function: 'log',
            handler: (input) => {
              const message = new TextDecoder().decode(input)
              console.log('[Plugin]', message)
              document.querySelectorAll("view-console")?.forEach(a => a.log(message))
              return {returnCode: 0, output: new Uint8Array()}
            }
          }
        ]
      })

      pluginManager.rawCall('random', 'setSeed', 27)
      const rrr = pluginManager.rawCall('random', 'seed')
      console.log(rrr)

      const balancedTree = {
        "nodeCount": 0,
        "maxDepth": 6,
        "maxBranching": 3,
        "minBranching": 1,
        "shapeBias": 0,
        "density": 0.7,
        "rootBranches": 0,
        "leafRatio": 0.4,
      }

      const treeName = "progresion"

      const treeResult = await pluginManager.call("treegen", "gen", JSON.stringify({name: treeName, ...balancedTree}))
      // console.log(treeResult)
      const DE = new TextDecoder()
      let data = await DE.decode(treeResult.output)
      console.log(JSON.parse(data).data)
      // console.log(3333)
      // const treeResult2 = await pluginManager.call("tree-storage2", "get", `{"id": "${treeName}"}`)
      // data = await DE.decode(treeResult2.output)
      // console.log(treeResult2, data)


    </script>
  </body>

  </html>
