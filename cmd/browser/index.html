<!DOCTYE html>
  <html lang="en">

  <head>
    <meta charset="UTF-8" />

    <title>Nested Web Components Example</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="build.nosync/tokens/css/variables.css">
    <link rel="stylesheet" href="build.nosync/tokens/css/atomic.css">
    <link rel="stylesheet" href="build.nosync/tokens/css/components.css">
    <link rel="stylesheet" href="app.css">
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet">
  </head>

  <body>

    <template id="view-empty">
      <div class="panel">
        <div class="panel-header">Empty</div>
        <div class="panel-content">aaa</div>
      </div>
    </template>
    <template id="view-testing">
      <div class="panel">
        <div class="panel-header">Testing Panel</div>
        <div class="panel-content">
          <button class="button-primary" type="button">ok</button>
          <button class="button-secondary" type="button">cancel</button>
        </div>
      </div>
    </template>

    <template id="view-splitter">
      <div class="panel">
        <div class="panel-header">Splitter</div>
        <div class="panel-content">
          <button class="button-primary" type="button" data-action="split-vertical">Vertical</button>
          <button class="button-secondary" type="button" data-action="split-horizontal">Horizontal</button>
        </div>
      </div>
    </template>

    <template id="view-handle">
      <div data-action="resize" class="handle" draggable="true">handle</div>
    </template>

    <template id="view-chrome">
      <div class="panel-header" style="background-color: transparent; padding-left: var(--panel-header-padding);">
        <select class="select" data-action="select-view">
          <option value="view-splitter">view-splitter</option>
          <option value="view-testing">view-testing</option>
          <option value="view-empty">view-empty</option>
        </select>
      </div>
      <div class="ne" data-action="ne" draggable="true"></div>
      <div class="se" data-action="se" draggable="true"></div>
      <div class="sw" data-action="sw" draggable="true"></div>
      <div class="nw" data-action="nw" draggable="true"></div>
    </template>

    <layout-parent handle-width="6" handle-height="20" id="scene">
      <view-testing panel="panel_1"></view-testing>
      <view-testing nesw="n" p="639" from="panel_1"></view-testing>
    </layout-parent>



    <script type="module">
      import {LayoutParent} from "./views/layout.js"
      import {ViewEmpty} from "./views/view-empty.js"
      import {ViewTesting} from "./views/view-testing.js"
      import {ViewSplitter} from "./views/view-splitter.js"
      // import {bus} from "./systems/event-bus.js"
      // window.bus = bus

      customElements.define('layout-parent', LayoutParent)
      customElements.define('view-empty', ViewEmpty)
      customElements.define('view-testing', ViewTesting)
      customElements.define('view-splitter', ViewSplitter)

    </script>
  </body>

  </html>
