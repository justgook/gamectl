<!DOCTYE html>
  <html lang="en">

  <head>
    <meta charset="UTF-8" />

    <title>Nested Web Components Example</title>
    <link rel="icon" href="/favicon.svg">
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="base.css">
    <link id="theme-stylesheet" data-theme-stylesheet rel="stylesheet" href="themes/the98.css">
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=JetBrains+Mono:wght@300;400;500;600;700&family=Orbitron:wght@400;700&family=Roboto:wght@400;500;700&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet">
  </head>

  <body>
    <template id="view-pipeline">
      <div style="display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-3);">
        <details>
          <summary>1. Create World Tree</summary>
          <form name="tree"
            style="display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-3);">
            <label>Node Count: <span>10</span> <input type="range" name="nodeCount" min="5" max="100" value="10"
                oninput="this.previousElementSibling.textContent=this.value"></label>
            <label>Max Depth: <span>0</span> <input type="range" name="maxDepth" min="0" max="10" value="0"
                oninput="this.previousElementSibling.textContent=this.value"></label>
            <label>Max Branching: <span>0</span> <input type="range" name="maxBranching" min="0" max="10" value="0"
                oninput="this.previousElementSibling.textContent=this.value"></label>
            <label>Root Branches: <span>0</span> <input type="range" name="rootBranches" min="0" max="20" value="0"
                oninput="this.previousElementSibling.textContent=this.value"></label>
            <label>Output Name: <input type="text" name="treeId" value="progression"></label>
            <button type="submit">Generate Tree</button>
          </form>
        </details>
        <details>
          <summary>2. Assign Biomes</summary>
          <form name="biomes"
            style="display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-3);">
            <label>Tree ID: <input type="text" name="treeId" value="progression"></label>
            <label>Biomes Query: <input type="text" name="biomesQuery" value="SELECT name FROM biomes ORDER BY RANDOM()"
                style="width: 100%;"></label>
            <button type="submit">Assign Biomes</button>
          </form>
        </details>
        <details>
          <summary>3. Assign Keys & Locks</summary>
          <form name="keylock"
            style="display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-3);">
            <label>Tree ID: <input type="text" name="treeId" value="progression"></label>
            <label>Keys Query: <input type="text" name="keysQuery"
                value="SELECT name FROM keys ORDER BY RANDOM() LIMIT 15" style="width: 100%;"></label>
            <label>Key Chance: <span>0.5</span> <input type="range" name="keyChance" min="0" max="1" step="0.1"
                value="0.5" oninput="this.previousElementSibling.textContent=this.value"></label>
            <label>Lock Chance: <span>0.7</span> <input type="range" name="lockChance" min="0" max="1" step="0.1"
                value="0.7" oninput="this.previousElementSibling.textContent=this.value"></label>
            <label>Max Keys Per Lock: <span>2</span> <input type="range" name="maxKeysPerLock" min="1" max="5" value="2"
                oninput="this.previousElementSibling.textContent=this.value"></label>
            <button type="submit">Assign Keys & Locks</button>
          </form>
        </details>
        <details open>
          <summary>4. Create Minimap</summary>
          <form name="minimap"
            style="display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-3);">
            <label>Input Tree: <input type="text" name="inputTreeId" value="progression"></label>
            <label>Output Map: <input type="text" name="mapId" value="new_map"></label>
            <label>Layout Direction:
              <select name="direction">
                <option value="radial" selected>Radial</option>
                <option value="topDown">Top Down</option>
                <option value="bottomUp">Bottom Up</option>
                <option value="leftToRight">Left to Right</option>
                <option value="rightToLeft">Right to Left</option>
                <option value="directional">Directional</option>
              </select>
            </label>
            <button type="submit">Generate Minimap</button>
          </form>
        </details>
        <details>
          <summary>5. Apply Automap Rules</summary>
          <form name="automap"
            style="display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-3);">
            <label>Rules Map: <input type="text" name="rulesMapId" value="rules"></label>
            <label>Input Map: <input type="text" name="inputMapId" value="new_map"></label>
            <label>Output Map: <input type="text" name="outputMapId" value="automap_result"></label>
            <button type="submit">Apply Automap</button>
          </form>
        </details>
      </div>
    </template>

    <template id="view-sql-console">
      <div data-element="output"
        style="flex: 1; min-height: 0; overflow: auto; padding: var(--space-3); background: var(--bg);">
      </div>
      <div
        style="display: flex; align-items: flex-start; padding: var(--space-2); border-top: 1px solid var(--border); background: var(--surface);">
        <span
          style="color: var(--accent); font-family: var(--font-mono); font-size: var(--font-sm); padding: 8px 4px 8px 8px;">></span>
        <textarea data-element="input" placeholder="SELECT * FROM sqlite_schema;" rows="1"
          style="flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-family: var(--font-mono); font-size: var(--font-sm); resize: none; padding: 8px; line-height: 1.4; min-height: 24px; field-sizing: content;"></textarea>
      </div>
    </template>

    <template id="view-sql-table">
      <div data-element="toolbar" class="sql-table-toolbar">
        <button data-action="refresh" aria-label="Refresh" title="Refresh (Ctrl+R)"><i aria-hidden="true">refresh</i></button>
        <button data-action="insert" aria-label="Insert Row" title="Insert Row (Insert)"><i aria-hidden="true">add</i></button>
        <button data-action="delete" aria-label="Delete Row" title="Delete Row (Ctrl+Del / Cmd+Backspace)"><i aria-hidden="true">remove</i></button>
      </div>
      <div data-element="table-container" class="sql-table-container"></div>
      <div class="sql-table-footer">
        <div data-element="pagination" class="sql-table-pagination"></div>
        <div data-element="status" class="sql-table-status"></div>
      </div>
    </template>

    <template id="view-sql-tables">
      <div data-element="toolbar" class="sql-tables-toolbar">
        <button data-action="refresh" aria-label="Refresh" title="Refresh"><i aria-hidden="true">refresh</i></button>
        <button data-action="new-table" aria-label="Create New Table" title="Create New Table"><i aria-hidden="true">post_add</i></button>
      </div>
      <div data-element="list-container" class="sql-tables-list"></div>
      <div data-element="status" class="sql-tables-status"></div>
    </template>

    <template id="view-files">
      <div data-element="toolbar" class="files-toolbar">
        <button data-action="refresh" aria-label="Refresh" title="Refresh"><i aria-hidden="true">refresh</i></button>
        <button data-action="new-file" aria-label="New File" title="New File"><i aria-hidden="true">note_add</i></button>
        <button data-action="new-folder" aria-label="New Folder" title="New Folder"><i aria-hidden="true">create_new_folder</i></button>
        <button data-action="delete" aria-label="Delete" title="Delete"><i aria-hidden="true">delete</i></button>
        <button data-action="upload" aria-label="Upload File" title="Upload File"><i aria-hidden="true">upload</i></button>
        <button data-action="download" aria-label="Download File" title="Download File"><i aria-hidden="true">download</i></button>
        <span class="files-path" data-element="path-display">/</span>
      </div>
      <div data-element="tree-container" class="files-tree-container">
        <table class="files-tree">
          <thead>
            <tr>
              <th class="files-col-name">Name</th>
              <th class="files-col-modified">Date Modified</th>
              <th class="files-col-size">Size</th>
              <th class="files-col-kind">Kind</th>
            </tr>
          </thead>
          <tbody data-element="tree-body"></tbody>
        </table>
      </div>
      <div data-element="status" class="files-status"></div>
    </template>

    <!-- Canvas views (nodegraph, tilemap, tree) create their content programmatically -->
    <template id="view-tilemap">
      <div slot="header-controls">
        <input type="number" data-action="tile-value" value="1" min="0"
          style="width: 32px; height: 32px; text-align: center; padding: 0; border: 2px solid var(--border-focus); border-radius: var(--radius-sm); background: var(--surface); color: var(--text);">
        <button data-action="save" class="accent" aria-label="Save" title="Save"><i aria-hidden="true">save</i></button>
        <button data-action="reload" aria-label="Reload" title="Reload"><i aria-hidden="true">refresh</i></button>
        <button data-action="zoom-in" aria-label="Zoom In" title="Zoom In"><i aria-hidden="true">zoom_in</i></button>
        <button data-action="zoom-out" aria-label="Zoom Out" title="Zoom Out"><i aria-hidden="true">zoom_out</i></button>
        <button data-action="zoom-fit" aria-label="Fit View" title="Fit View"><i aria-hidden="true">fit_screen</i></button>
      </div>
    </template>

    <template id="view-nodegraph">
      <div slot="header-controls">
        <button data-action="add-node" aria-label="Add Node" title="Add Node"><i aria-hidden="true">add</i></button>
        <button data-action="run" class="success" aria-label="Run" title="Run"><i
            aria-hidden="true">play_arrow</i></button>
        <button data-action="save" class="accent" aria-label="Save" title="Save"><i aria-hidden="true">save</i></button>
        <button data-action="load" aria-label="Load" title="Load"><i aria-hidden="true">folder_open</i></button>
        <button data-action="edit" aria-label="Edit Node" title="Edit Node"><i aria-hidden="true">edit</i></button>
        <button data-action="reload" aria-label="Reload" title="Reload"><i aria-hidden="true">refresh</i></button>
        <button data-action="zoom-in" aria-label="Zoom In" title="Zoom In"><i aria-hidden="true">zoom_in</i></button>
        <button data-action="zoom-out" aria-label="Zoom Out" title="Zoom Out"><i aria-hidden="true">zoom_out</i></button>
        <button data-action="zoom-fit" aria-label="Fit View" title="Fit View"><i aria-hidden="true">fit_screen</i></button>
      </div>
    </template>

    <template id="view-tree">
      <div slot="header-controls">
        <button data-action="save" class="accent" aria-label="Save" title="Save"><i aria-hidden="true">save</i></button>
        <button data-action="reload" aria-label="Reload" title="Reload"><i aria-hidden="true">refresh</i></button>
        <button data-action="zoom-in" aria-label="Zoom In" title="Zoom In"><i aria-hidden="true">zoom_in</i></button>
        <button data-action="zoom-out" aria-label="Zoom Out" title="Zoom Out"><i aria-hidden="true">zoom_out</i></button>
        <button data-action="zoom-fit" aria-label="Fit View" title="Fit View"><i aria-hidden="true">fit_screen</i></button>
      </div>
    </template>

    <template id="view-tile-extractor">
      <div slot="header-controls">
        <button data-action="load" aria-label="Load" title="Load"><i aria-hidden="true">folder_open</i></button>
        <button data-action="reload" aria-label="Reload" title="Reload"><i aria-hidden="true">refresh</i></button>
        <button data-action="zoom-in" aria-label="Zoom In" title="Zoom In"><i aria-hidden="true">zoom_in</i></button>
        <button data-action="zoom-out" aria-label="Zoom Out" title="Zoom Out"><i aria-hidden="true">zoom_out</i></button>
        <button data-action="zoom-fit" aria-label="Fit View" title="Fit View"><i aria-hidden="true">fit_screen</i></button>
      </div>
    </template>

    <template id="view-sprite-extractor">
      <div slot="header-controls">
        <button data-action="load" aria-label="Load" title="Load"><i aria-hidden="true">folder_open</i></button>
        <button data-action="reload" aria-label="Reload" title="Reload"><i aria-hidden="true">refresh</i></button>
        <button data-action="zoom-in" aria-label="Zoom In" title="Zoom In"><i aria-hidden="true">zoom_in</i></button>
        <button data-action="zoom-out" aria-label="Zoom Out" title="Zoom Out"><i aria-hidden="true">zoom_out</i></button>
        <button data-action="zoom-fit" aria-label="Fit View" title="Fit View"><i aria-hidden="true">fit_screen</i></button>
      </div>
    </template>

    <template id="view-sprite-packer">
      <div slot="header-controls">
        <button data-action="add-sprites" aria-label="Add Sprites" title="Add Sprites"><i aria-hidden="true">add_photo_alternate</i></button>
        <button data-action="clear" aria-label="Clear" title="Clear"><i aria-hidden="true">delete_sweep</i></button>
        <span style="width: 1px; height: 20px; background: var(--border);"></span>
        <button data-action="zoom-in" aria-label="Zoom In" title="Zoom In"><i aria-hidden="true">zoom_in</i></button>
        <button data-action="zoom-out" aria-label="Zoom Out" title="Zoom Out"><i aria-hidden="true">zoom_out</i></button>
        <button data-action="zoom-fit" aria-label="Fit View" title="Fit View"><i aria-hidden="true">fit_screen</i></button>
      </div>
    </template>

    <template id="view-skeleton">
      <div slot="header-controls">
        <select data-action="pose-select" title="Select Pose">
          <option value="default">default</option>
        </select>
        <button data-action="pose-save" aria-label="Save Pose" title="Save Pose"><i aria-hidden="true">save</i></button>
        <button data-action="pose-new" aria-label="Save as New Pose" title="Save as New Pose"><i aria-hidden="true">add</i></button>
        <button data-action="pose-reset" aria-label="Reset to Saved Pose" title="Reset to Saved Pose"><i aria-hidden="true">replay</i></button>
        <span style="width: 1px; height: 20px; background: var(--border);"></span>
        <button data-action="add-bone" aria-label="Add Bone" title="Add Bone"><i aria-hidden="true">device_hub</i></button>
        <button data-action="toggle-labels" aria-label="Toggle Labels" title="Toggle Labels"><i aria-hidden="true">label</i></button>
        <span style="width: 1px; height: 20px; background: var(--border);"></span>
        <button data-action="save" class="accent" aria-label="Save Skeleton" title="Save Skeleton"><i aria-hidden="true">save</i></button>
        <button data-action="reload" aria-label="Reload" title="Reload"><i aria-hidden="true">refresh</i></button>
        <button data-action="zoom-in" aria-label="Zoom In" title="Zoom In"><i aria-hidden="true">zoom_in</i></button>
        <button data-action="zoom-out" aria-label="Zoom Out" title="Zoom Out"><i aria-hidden="true">zoom_out</i></button>
        <button data-action="zoom-fit" aria-label="Fit View" title="Fit View"><i aria-hidden="true">fit_screen</i></button>
      </div>
    </template>

    <template id="view-timeline">
      <div slot="header-controls">
        <button data-action="play" aria-label="Play" title="Play"><i aria-hidden="true">play_arrow</i></button>
        <button data-action="stop" aria-label="Stop" title="Stop"><i aria-hidden="true">stop</i></button>
        <span style="width: 1px; height: 20px; background: var(--border);"></span>
        <button data-action="add-key" aria-label="Add Key" title="Add Key"><i aria-hidden="true">add</i></button>
        <button data-action="delete-key" aria-label="Delete Key" title="Delete Key"><i aria-hidden="true">delete</i></button>
        <span style="width: 1px; height: 20px; background: var(--border);"></span>
        <label>
          <input type="checkbox" data-action="loop">
          Loop
        </label>
        <span style="width: 1px; height: 20px; background: var(--border);"></span>
        <span data-element="time-display">0.00s</span>
      </div>
    </template>

    <template id="view-animation-editor">
      <div slot="header-controls">
        <button data-action="load-spritesheet" aria-label="Load Sheet" title="Load Sheet"><i aria-hidden="true">folder_open</i></button>
        <span style="width: 1px; height: 20px; background: var(--border);"></span>
        <label style="display: inline-flex; align-items: center; gap: var(--space-2);">
          <span>Tile:</span>
          <input type="number" data-element="tile-width" value="16" min="1" title="Tile Width" style="width: 64px;">
          <span>x</span>
          <input type="number" data-element="tile-height" value="16" min="1" title="Tile Height" style="width: 64px;">
        </label>
        <span style="width: 1px; height: 20px; background: var(--border);"></span>
        <button data-action="new" class="accent" aria-label="New" title="New"><i aria-hidden="true">add</i></button>
        <span style="width: 1px; height: 20px; background: var(--border);"></span>
        <button data-action="save" class="accent" aria-label="Save" title="Save"><i aria-hidden="true">save</i></button>
      </div>
    </template>

    <template id="view-stb-editor">
      <div slot="header-controls">
        <button class="accent tool-btn" data-tool="1" title="Brush tool" aria-label="Brush tool">
          <i aria-hidden="true">brush</i>
        </button>
        <button data-tool="0" title="Select tool" aria-label="Select tool">
          <i aria-hidden="true">select</i>
        </button>
        <button data-tool="2" title="Erase tool" aria-label="Erase tool">
          <i aria-hidden="true">ink_eraser</i>
        </button>
        <button data-tool="3" title="Eyedropper tool" aria-label="Eyedropper tool">
          <i aria-hidden="true">colorize</i>
        </button>
        <span style="width: 1px; height: 20px; background: var(--border);"></span>
        <button data-id="undo-btn" title="Undo" aria-label="Undo">
          <i aria-hidden="true">undo</i>
        </button>
        <button data-id="redo-btn" title="Redo" aria-label="Redo">
          <i aria-hidden="true">redo</i>
        </button>
        <button data-id="cut-btn" title="Cut" aria-label="Cut">
          <i aria-hidden="true">content_cut</i>
        </button>
        <button data-id="copy-btn" title="Copy" aria-label="Copy">
          <i aria-hidden="true">content_copy</i>
        </button>
        <button data-id="paste-btn" title="Paste" aria-label="Paste">
          <i aria-hidden="true">content_paste</i>
        </button>
        <button data-id="clear-btn" title="Clear map" aria-label="Clear map">
          <i aria-hidden="true">delete_sweep</i>
        </button>
        <span style="width: 1px; height: 20px; background: var(--border);"></span>
        <button class="accent" data-id="grid-btn" title="Toggle grid" aria-label="Toggle grid">
          <i aria-hidden="true">grid_on</i>
        </button>
        <button data-id="fit-btn" title="Fit map to viewport" aria-label="Fit map to viewport">
          <i aria-hidden="true">fit_screen</i>
        </button>
      </div>
    </template>

    <template id="view-opr-unit-builder">
      <div slot="header-controls">
        <button data-action="random-unit" aria-label="Random Unit" title="Random Unit"><i
            aria-hidden="true">shuffle</i></button>
        <button data-action="export-json" class="accent" aria-label="Export JSON" title="Export JSON"><i
            aria-hidden="true">ios_share</i></button>
      </div>
      <div
        style="display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-3); height: 100%; overflow: auto;">
        <!-- Universe/Army/Unit Selectors -->
        <div style="display: flex; gap: var(--space-2); flex-wrap: wrap;">
          <label style="display: flex; flex-direction: column; gap: var(--space-1); flex: 1; min-width: 150px;">
            <span style="font-weight: 500; color: var(--text-muted);">Universe</span>
            <select data-select="universe"
              style="padding: var(--space-2); border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); font-size: var(--font-md);">
              <option value="">-- Select Universe --</option>
            </select>
          </label>
          <label style="display: flex; flex-direction: column; gap: var(--space-1); flex: 1; min-width: 150px;">
            <span style="font-weight: 500; color: var(--text-muted);">Army</span>
            <select data-select="army" disabled
              style="padding: var(--space-2); border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); font-size: var(--font-md);">
              <option value="">-- Select Army --</option>
            </select>
          </label>
          <label style="display: flex; flex-direction: column; gap: var(--space-1); flex: 1; min-width: 150px;">
            <span style="font-weight: 500; color: var(--text-muted);">Unit</span>
            <select data-select="unit" disabled
              style="padding: var(--space-2); border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); font-size: var(--font-md);">
              <option value="">-- Select Unit --</option>
            </select>
          </label>
        </div>

        <!-- Unit Display Area -->
        <div data-element="unit-display" style="display: none; flex-direction: column; gap: var(--space-3);">
          <!-- Unit Header -->
          <div
            style="background: var(--surface-elevated); padding: var(--space-3); border-radius: var(--radius-md); border-left: 4px solid var(--accent);">
            <h2 data-element="unit-name"
              style="margin: 0 0 var(--space-2) 0; font-size: var(--font-xl); color: var(--text);">
            </h2>
            <div
              style="display: flex; gap: var(--space-4); flex-wrap: wrap; font-size: var(--font-sm); color: var(--text-muted);">
              <div><strong>Size:</strong> <span data-element="unit-size"></span></div>
              <div><strong>Cost:</strong> <span data-element="unit-cost"></span>pts</div>
              <div><strong>Quality:</strong> <span data-element="unit-quality"></span>+</div>
              <div><strong>Defense:</strong> <span data-element="unit-defense"></span>+</div>
              <div><strong>Type:</strong> <span data-element="unit-type"></span></div>
            </div>
          </div>

          <!-- Special Rules -->
          <div data-element="special-rules-container" style="display: none;">
            <h3 style="margin: 0 0 var(--space-2) 0; font-size: var(--font-lg); color: var(--text);">
              Special Rules</h3>
            <div data-element="special-rules" style="display: flex; gap: var(--space-2);"></div>
          </div>

          <!-- Weapons -->
          <div data-element="weapons-container" style="display: none;">
            <h3 style="margin: 0 0 var(--space-2) 0; font-size: var(--font-lg); color: var(--text);">
              Weapons</h3>
            <div data-element="weapons" style="display: flex; flex-direction: column; gap: var(--space-2);">
            </div>
          </div>

          <!-- Upgrades -->
          <div data-element="upgrades-container" style="display: none;">
            <h3 style="margin: 0 0 var(--space-2) 0; font-size: var(--font-lg); color: var(--text);">
              Available Upgrades</h3>
            <div data-element="upgrades" style="display: flex; flex-direction: column; gap: var(--space-2);">
            </div>
          </div>

          <!-- Total Cost -->
          <div
            style="background: var(--surface-elevated); padding: var(--space-3); border-radius: var(--radius-md); margin-top: auto;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <strong style="font-size: var(--font-lg);">Total Cost:</strong>
              <strong data-element="total-cost" style="font-size: var(--font-xl); color: var(--accent);">0pts</strong>
            </div>
          </div>
        </div>

        <!-- Empty State -->
        <div data-element="empty-state"
          style="flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-faint); font-size: var(--font-lg);">
          Select a universe, army, and unit to begin
        </div>
      </div>
    </template>
    <!-- ========================================== -->
    <!-- Node Popup External Templates              -->
    <!-- These templates are referenced by node-popup via template="id" attribute -->
    <!-- ========================================== -->

    <!-- Text Input Template -->
    <template id="node-popup-text">
      <div style="padding: 16px;">
        <input type="text" data-output="text" value="" placeholder="Enter text..."
          style="font-size: 16px; padding: 8px; border: 2px solid #ddd; border-radius: 4px; width: 100%;">
      </div>
    </template>

    <!-- Number Input with Numpad Template -->
    <template id="node-popup-numpad">
      <div style="padding: 12px;" data-numpad>
        <input type="number" data-output="value" value="0"
          style="font-size: 16px; padding: 8px; width: 100%; text-align: center; margin-bottom: 10px;">
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;">
          <button
            onclick="let i=this.closest('[data-numpad]').querySelector('input'); i.value = String(i.value||'') + '7'; i.focus()"
            style="padding: 8px; font-size: 14px;">7</button>
          <button
            onclick="let i=this.closest('[data-numpad]').querySelector('input'); i.value = String(i.value||'') + '8'; i.focus()"
            style="padding: 8px; font-size: 14px;">8</button>
          <button
            onclick="let i=this.closest('[data-numpad]').querySelector('input'); i.value = String(i.value||'') + '9'; i.focus()"
            style="padding: 8px; font-size: 14px;">9</button>
          <button
            onclick="let i=this.closest('[data-numpad]').querySelector('input'); i.value = String(i.value||'') + '4'; i.focus()"
            style="padding: 8px; font-size: 14px;">4</button>
          <button
            onclick="let i=this.closest('[data-numpad]').querySelector('input'); i.value = String(i.value||'') + '5'; i.focus()"
            style="padding: 8px; font-size: 14px;">5</button>
          <button
            onclick="let i=this.closest('[data-numpad]').querySelector('input'); i.value = String(i.value||'') + '6'; i.focus()"
            style="padding: 8px; font-size: 14px;">6</button>
          <button
            onclick="let i=this.closest('[data-numpad]').querySelector('input'); i.value = String(i.value||'') + '1'; i.focus()"
            style="padding: 8px; font-size: 14px;">1</button>
          <button
            onclick="let i=this.closest('[data-numpad]').querySelector('input'); i.value = String(i.value||'') + '2'; i.focus()"
            style="padding: 8px; font-size: 14px;">2</button>
          <button
            onclick="let i=this.closest('[data-numpad]').querySelector('input'); i.value = String(i.value||'') + '3'; i.focus()"
            style="padding: 8px; font-size: 14px;">3</button>
          <button
            onclick="let i=this.closest('[data-numpad]').querySelector('input'); i.value = String(i.value||'') + '0'; i.focus()"
            style="padding: 8px; font-size: 14px;">0</button>
          <button
            onclick="let i=this.closest('[data-numpad]').querySelector('input'); i.value = i.value.slice(0, -1); i.focus()"
            style="padding: 8px; font-size: 14px; background: #ff6b6b; color: white;">&#9003;</button>
          <button onclick="let i=this.closest('[data-numpad]').querySelector('input'); i.value = ''; i.focus()"
            style="padding: 8px; font-size: 14px; background: #ff6b6b; color: white;">Clear</button>
        </div>
      </div>
    </template>

    <!-- Simple Numpad Test Template -->
    <template id="node-popup-simple-numpad">
      <input data-output="value" value="0">
      <button onclick="this.parentNode.querySelector('input').value += '1'">1</button>
      <button onclick="this.parentNode.querySelector('input').value += '2'">2</button>
      <button onclick="this.parentNode.querySelector('input').value = ''">C</button>
    </template>

    <!-- Input Processor Template -->
    <template id="node-popup-input-processor">
      <div style="padding: 16px;">
        <label>From connected node:</label>
        <input type="number" data-input="baseValue" readonly
          style="background: #f5f5f5; padding: 8px; border: 1px solid #ddd; border-radius: 4px; width: 100%; margin-bottom: 8px;">
        <label>Manual value:</label>
        <input type="number" data-output="result" value="10"
          style="padding: 8px; border: 2px solid #ddd; border-radius: 4px; width: 100%; margin-bottom: 8px;">
        <button type="button"
          onclick="let b=this.closest('div').querySelector('[data-input=baseValue]'); let r=this.closest('div').querySelector('[data-output=result]'); if(b.value) r.value = b.value;"
          style="padding: 8px; background: #007bff; color: white; border: none; border-radius: 4px;">
          Copy Base Value
        </button>
      </div>
    </template>

    <!-- Tilemap Preview Template -->
    <template id="node-popup-tilemap-preview">
      <view-tilemap data-key="new_map" style="width: 800px; height: 600px; border: 1px solid #ccc; border-radius: 4px;">
      </view-tilemap>
    </template>

    <!-- Tree Preview Template -->
    <template id="node-popup-tree-preview">
      <view-tree data-store-key="progression"
        style="width: 800px; height: 600px; border: 1px solid #ccc; border-radius: 4px;">
      </view-tree>
    </template>

    <!-- SQL Table Preview Template -->
    <template id="node-popup-sql-table-preview">
      <view-sql-table data-query="SELECT 1" data-page-size="20"
        style="width: 900px; height: 500px; border: 1px solid #ccc; border-radius: 4px;">
      </view-sql-table>
    </template>

    <!-- Node Code Editor Popup Template -->
    <template id="popup-node-code">
      <div style="display: flex; flex-direction: column; gap: var(--space-2);">
        <div
          style="font-size: var(--font-sm); color: var(--text-muted); padding: var(--space-2); background: var(--surface); border-radius: var(--radius-sm);">
          <strong>Inputs ($in):</strong> <span data-element="inputs-info">none</span><br>
          <strong>Outputs ($out):</strong> <span data-element="outputs-info">none</span>
        </div>
        <textarea data-element="code-editor" spellcheck="false"
          placeholder="// Write your code here&#10;// Access inputs via $in.name&#10;// Set outputs via $out.name = value"
          style="width: 100%; min-width: 700px; min-height: 300px; font-family: monospace; font-size: 14px; padding: var(--space-2); border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); resize: vertical; tab-size: 2;"></textarea>
        <div data-element="error-display"
          style="color: var(--danger); font-size: var(--font-sm); display: none; padding: var(--space-2); background: color-mix(in oklab, var(--danger), transparent 85%); border-radius: var(--radius-sm);">
        </div>
        <div data-element="button-container"
          style="display: flex; gap: var(--space-2); justify-content: flex-end; align-items: center; margin-top: var(--space-2);">
          <button data-action="cancel">Cancel</button>
          <button class="accent" data-action="save">Save</button>
        </div>
      </div>
    </template>

    <!-- Splash Screen - renders immediately before app boot completes -->
    <splash-screen id="splash-screen"></splash-screen>

    <toast-manager>
      <popup-manager>
        <layout-manager>
          <view-area panel="0"><view-nodegraph></view-nodegraph></view-area>
        </layout-manager>
      </popup-manager>
    </toast-manager>
    <script src="coi-serviceworker.js"></script>
    <script type="module" src="/splash-screen.js"></script>
    <script type="module" src="/app.js"></script>
  </body>

  </html>
