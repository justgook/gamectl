<!DOCTYE html>
  <html lang="en">

  <head>
    <meta charset="UTF-8" />

    <title>Nested Web Components Example</title>
    <link rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="build.nosync/tokens/css/variables.css">
    <link rel="stylesheet" href="build.nosync/tokens/css/atomic.css">
    <link rel="stylesheet" href="build.nosync/tokens/css/components.css">
    <link rel="stylesheet" href="app.css">
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet">
  </head>

  <body>

    <template id="view-empty">
      <div class="panel">
        <div class="panel-header">Empty</div>
        <div class="panel-content">Empty panel</div>
      </div>
    </template>
    <template id="view-testing">
      <div class="panel">
        <div class="panel-header">Testing Panel</div>
        <div class="panel-content" style="display: flex; flex-direction: column;">
          <button class="button-primary" type="button" onclick="pluginManager.call('host', 'log', 'hello world')">call
            log</button>
          <button class="button-secondary" type="button" onclick="this.closest('[panel]').generateWorldgraph()">Create
            world tree</button>
          <button class="button-secondary" type="button" onclick="this.closest('[panel]').assignBiomeNames()">Set Biome
            names</button>

          <button class="button-secondary" type="button" onclick="this.closest('[panel]').getTree()">Get World
            tree</button>
          <button class="button-secondary" type="button" onclick="this.closest('[panel]').createMinimap()">Create
            minimap</button>
          <button class="button-secondary" type="button" onclick="this.closest('[panel]').getMinimap()">Get
            minimap</button>
        </div>
      </div>
    </template>

    <template id="view-pipeline">
      <div class="panel">
        <div class="panel-header">Pipeline</div>
        <div class="panel-content" style="display: flex; flex-direction: column; gap: 8px;">
          <details open>
            <summary>1. Create World Tree</summary>
            <form name="tree" style="display: flex; flex-direction: column; gap: 4px; padding: 8px;">
              <label>Node Count: <span>10</span> <input type="range" name="nodeCount" min="5" max="100" value="10"
                  oninput="this.previousElementSibling.textContent=this.value"></label>
              <label>Max Depth: <span>0</span> <input type="range" name="maxDepth" min="0" max="10" value="0"
                  oninput="this.previousElementSibling.textContent=this.value"></label>
              <label>Max Branching: <span>0</span> <input type="range" name="maxBranching" min="0" max="10" value="0"
                  oninput="this.previousElementSibling.textContent=this.value"></label>
              <label>Root Branches: <span>0</span> <input type="range" name="rootBranches" min="0" max="20" value="0"
                  oninput="this.previousElementSibling.textContent=this.value"></label>
              <label>Output Name: <input type="text" name="treeId" value="progression"></label>
              <button class="button-primary" type="submit">Generate Tree</button>
            </form>
          </details>
          <details>
            <summary>2. Create Minimap</summary>
            <form name="minimap" style="display: flex; flex-direction: column; gap: 4px; padding: 8px;">
              <label>Input Tree: <input type="text" name="inputTreeId" value="progression"></label>
              <label>Output Map: <input type="text" name="mapId" value="new_map"></label>
              <button class="button-primary" type="submit">Generate Minimap</button>
            </form>
          </details>
        </div>
      </div>
    </template>

    <template id="view-splitter">
      <div class="panel">
        <div class="panel-header">Splitter</div>
        <div class="panel-content">
          <button class="button-primary" type="button" data-action="split-vertical">Vertical</button>
          <button class="button-secondary" type="button" data-action="split-horizontal">Horizontal</button>
        </div>
      </div>
    </template>

    <template id="view-console">
      <div class="panel">
        <div class="panel-header">Console</div>
        <div class="panel-content">
          <pre data-element="log-output" style="white-space: pre-wrap;"></pre>
        </div>
      </div>
    </template>

    <template id="view-nodegraph">
      <div class="panel">
        <div class="panel-header">Node Graph</div>
        <div class="panel-content" style="padding: 0; position: relative;">
          <canvas style="cursor: grab;"></canvas>
          <div
            style="position: absolute; top: 10px; right: 10px; z-index: 100; display: flex; gap: 8px; padding: 8px; background: rgba(0, 0, 0, 0.5); border-radius: 4px;">
            <button data-action="add-node" class="button-primary">+ Node</button>
            <button data-action="run" class="button-success">▶ Run</button>
            <button data-action="reload" class="button-secondary">🔄 Reload</button>
            <button data-action="zoom-in" class="button-secondary">+</button>
            <button data-action="zoom-out" class="button-secondary">−</button>
            <button data-action="zoom-fit" class="button-secondary">⊡ Fit</button>
          </div>
          <div class="tooltip" data-tooltip></div>
        </div>
      </div>
    </template>

    <template id="view-tilemap">
      <div class="panel">
        <div class="panel-header">Tilemap</div>
        <div class="panel-content" style="padding: 0;">
          <canvas></canvas>
          <div
            style="position: absolute; top: 10px; right: 10px; z-index: 100; display: flex; gap: 8px; padding: 8px; background: rgba(0, 0, 0, 0.5); border-radius: 4px;">
            <button data-action="reload" class="button-secondary">🔄 Reload</button>
            <button data-action="zoom-in" class="button-secondary">+</button>
            <button data-action="zoom-out" class="button-secondary">−</button>
            <button data-action="zoom-fit" class="button-secondary">⊡ Fit</button>
          </div>
          <div class="tooltip" data-tooltip></div>
        </div>
      </div>
    </template>

    <template id="view-tree">
      <div class="panel">
        <div class="panel-header">Minimap</div>
        <div class="panel-content" style="padding: 0;">
          <canvas></canvas>
          <div
            style="position: absolute; top: 10px; right: 10px; z-index: 100; display: flex; gap: 8px; padding: 8px; background: rgba(0, 0, 0, 0.5); border-radius: 4px;">
            <button data-action="reload" class="button-secondary">🔄 Reload</button>
            <button data-action="zoom-in" class="button-secondary">+</button>
            <button data-action="zoom-out" class="button-secondary">−</button>
            <button data-action="zoom-fit" class="button-secondary">⊡ Fit</button>
          </div>
          <div class="tooltip" data-tooltip></div>
        </div>
      </div>
    </template>
    <template id="view-handle">
      <div data-action="resize" class="handle" draggable="true">handle</div>
    </template>

    <template id="view-chrome">
      <div class="panel-header" style="background-color: transparent; padding-left: var(--panel-header-padding);">
        <select class="select" data-action="select-view">
          <optgroup label="Old">
            <option value="view-splitter">splitter</option>
            <option value="view-testing">testing</option>
            <option value="view-pipeline">pipeline</option>
            <option value="view-empty">empty</option>
            <option value="view-console">console</option>
          </optgroup>
          <optgroup label="new">
            <option value="view-nodegraph">nodegraph</option>
            <option value="view-tree">tree</option>
            <option value="view-tilemap">tilemap</option>
          </optgroup>
        </select>
      </div>
      <div class="ne" data-action="ne" draggable="true"></div>
      <div class="se" data-action="se" draggable="true"></div>
      <div class="sw" data-action="sw" draggable="true"></div>
      <div class="nw" data-action="nw" draggable="true"></div>
    </template>

    <layout-parent handle-width="6" handle-height="20" id="scene">
      <view-nodegraph panel="panel_1">
        <node-input id="n1" x="100" y="100" value="10" label="Count"></node-input>
        <node-input id="n4" x="100" y="250" value="5" label="max Depth"></node-input>
        <node-plugin id="n2" x="400" y="175" plugin="treegen" function="gen" inputs="nodeCount:n1;maxDepth:n4"
          outputs="output,output2">
        </node-plugin>
        <node-output id="n3" x="700" y="100" inputs="value:n2"></node-output>
        <node-output id="n5" x="700" y="250" inputs="value:n2.output2"></node-output>
      </view-nodegraph>
      <!-- <view-tilemap panel="panel_1"></view-tilemap> -->
      <view-console nesw="s" r="200" from="panel_1"></view-console>
      <view-pipeline nesw="w" r="200" from="panel_1"></view-pipeline>
    </layout-parent>


    <script src="./plugin-manager.js"> </script>
    <script type="module">
      // current
      import {ViewEmpty} from "./views/view-empty.js"
      import {ViewSplitter} from "./views/view-splitter.js"
      import {LayoutParent} from "./views/layout.js"
      import {ViewTree} from "./views/view-tree.js"
      import {ViewConsole} from "./views/view-console.js"
      import {ViewTilemap} from "./views/view-tilemap.js"
      import {ViewTesting} from "./views/view-testing.js"
      import {ViewPipeline} from "./views/view-pipeline.js"
      import {ViewNodeGraph} from "./views/view-nodegraph.js"

      // Node graph components
      import "./views/nodegraph/node-base.js"
      import "./views/nodegraph/node-input.js"
      import "./views/nodegraph/node-plugin.js"
      import "./views/nodegraph/node-output.js"

      // window.bus = bus
      // import {bus} from "./systems/event-bus.js"

      //current stuff
      customElements.define('layout-parent', LayoutParent)
      customElements.define('view-empty', ViewEmpty)
      customElements.define('view-testing', ViewTesting)
      customElements.define('view-splitter', ViewSplitter)
      customElements.define('view-tilemap', ViewTilemap)
      customElements.define('view-tree', ViewTree)
      customElements.define('view-console', ViewConsole)
      customElements.define('view-pipeline', ViewPipeline)
      // customElements.define('view-nodegraph', ViewNodeGraph) //already registered in file

      /// THE PLUGIN MANAGER TESTING!!!
      const pluginNames = [
        // THE NEW stuff
        'random',
        'tilemap-storage',
        'tree-storage',
        'treegen',
        'minimap',
        // upcomming
        'automap',
      ];

      // Create modules array for plugin manager
      const modules = pluginNames.map(name => ({
        name: name,
        url: `/build.nosync/${name}.wasm`
      }))

      window.pluginManager = await PluginManager.create({
        modules: modules,
        hostFunctions: [
          {
            module: 'host',
            function: 'log',
            handler: (input) => {
              const message = typeof input === "string" ? input : new TextDecoder().decode(input)
              console.log('[Plugin]', message)
              document.querySelectorAll("view-console")?.forEach(a => a.log(message))
              return {returnCode: 0, output: new Uint8Array()}
            }
          }
        ]
      })
    </script>
  </body>

  </html>
