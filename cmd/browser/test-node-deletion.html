<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node Deletion Test</title>
    <style>
        body {
            margin: 0;
            background: #1e1e1e;
            color: white;
            font-family: sans-serif;
        }
        
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 100;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            border-radius: 4px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 8px 12px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        button:hover {
            background: #2563eb;
        }
        
        button.danger {
            background: #ef4444;
        }
        
        button.danger:hover {
            background: #dc2626;
        }

        view-nodegraph {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="controls">
        <button onclick="createTestNode()">Add Test Node</button>
        <button onclick="connectNodes()">Connect Nodes</button>
        <button onclick="deleteSelected()" class="danger">Delete Selected</button>
        <button onclick="deleteByAPI()" class="danger">Delete via API</button>
        <button onclick="listNodes()">List Nodes</button>
        <span id="info">Select nodes and test deletion</span>
    </div>

    <view-nodegraph id="nodegraph">
        <!-- Test nodes will be added here -->
    </view-nodegraph>

    <script type="module">
        // Import the view components
        import './views/view-nodegraph.js'
        import './views/nodegraph/node-input.js'
        import './views/nodegraph/node-plugin.js'
        import './views/nodegraph/node-popup.js'

        let nodeCounter = 1

        window.createTestNode = function() {
            const nodegraph = document.getElementById('nodegraph')
            
            // Create different types of test nodes
            const nodeTypes = [
                '<node-input type="number" value="42" outputs="value"></node-input>',
                '<node-plugin plugin="test" function="process" inputs="input" outputs="result"></node-plugin>',
                '<node-popup outputs="value"><template><input type="text" data-output="value" value="test"></template></node-popup>'
            ]
            
            const randomType = nodeTypes[Math.floor(Math.random() * nodeTypes.length)]
            const tempDiv = document.createElement('div')
            tempDiv.innerHTML = randomType
            const node = tempDiv.firstElementChild
            
            // Set unique ID and position
            node.id = `test_node_${nodeCounter++}`
            node.setAttribute('x', (Math.random() * 400 + 100).toString())
            node.setAttribute('y', (Math.random() * 300 + 100).toString())
            
            nodegraph.appendChild(node)
            updateInfo(`Created ${node.id}`)
        }

        window.connectNodes = function() {
            const nodegraph = document.getElementById('nodegraph')
            const nodes = Array.from(nodegraph.children).filter(child => child.id.startsWith('test_node_'))
            
            if (nodes.length < 2) {
                updateInfo('Need at least 2 nodes to connect')
                return
            }
            
            // Connect first two nodes
            const sourceNode = nodes[0]
            const targetNode = nodes[1]
            
            // Simple connection: assume source has 'value' or 'result' output, target accepts 'input'
            targetNode.setAttribute('inputs', `input:${sourceNode.id}.value`)
            updateInfo(`Connected ${sourceNode.id} -> ${targetNode.id}`)
        }

        window.deleteSelected = function() {
            const nodegraph = document.getElementById('nodegraph')
            const count = nodegraph.deleteSelectedNodes()
            updateInfo(`Deleted ${count} selected nodes`)
        }

        window.deleteByAPI = function() {
            const nodegraph = document.getElementById('nodegraph')
            const nodeIds = nodegraph.getNodeIds()
            
            if (nodeIds.length === 0) {
                updateInfo('No nodes to delete')
                return
            }
            
            // Delete the first node via API
            const nodeId = nodeIds[0]
            const deleted = nodegraph.deleteNodes(nodeId)
            updateInfo(`Deleted ${deleted} node via API: ${nodeId}`)
        }

        window.listNodes = function() {
            const nodegraph = document.getElementById('nodegraph')
            const nodeIds = nodegraph.getNodeIds()
            updateInfo(`Nodes: [${nodeIds.join(', ')}]`)
        }

        function updateInfo(message) {
            document.getElementById('info').textContent = message
            console.log('Node deletion test:', message)
        }

        // Initialize with some test nodes
        setTimeout(() => {
            createTestNode()
            createTestNode()
            createTestNode()
            setTimeout(connectNodes, 100)
        }, 100)
    </script>
</body>
</html>
