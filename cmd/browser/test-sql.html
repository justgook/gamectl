<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQL Plugin Test</title>
  <style>
    body {
      font-family: 'Courier New', monospace;
      max-width: 1200px;
      margin: 20px auto;
      padding: 20px;
      background: #1e1e1e;
      color: #d4d4d4;
    }

    h1 {
      color: #4ec9b0;
    }

    button {
      background: #0e639c;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 14px;
    }

    button:hover {
      background: #1177bb;
    }

    button:disabled {
      background: #555;
      cursor: not-allowed;
    }

    .output {
      background: #252526;
      border: 1px solid #3e3e42;
      padding: 15px;
      margin: 10px 0;
      border-radius: 4px;
      white-space: pre-wrap;
      font-family: 'Courier New', monospace;
      max-height: 400px;
      overflow-y: auto;
    }

    .success {
      color: #4ec9b0;
    }

    .error {
      color: #f48771;
    }

    .section {
      margin: 20px 0;
      padding: 15px;
      background: #2d2d30;
      border-radius: 4px;
    }

    .status {
      padding: 5px 10px;
      border-radius: 3px;
      display: inline-block;
      margin: 5px 0;
    }

    .status.loading {
      background: #1e3a8a;
    }

    .status.ready {
      background: #065f46;
    }
  </style>
</head>

<body>
  <h1>🗄️ SQL Plugin Test</h1>

  <div class="section">
    <h2>Plugin Status</h2>
    <div id="status" class="status loading">Loading...</div>
  </div>

  <div class="section">
    <h2>Test Operations</h2>
    <button onclick="testOpen()" id="btnOpen">1. Open Database</button>
    <button onclick="testCreateTable()" id="btnCreate" disabled>2. Create Table</button>
    <button onclick="testInsert()" id="btnInsert" disabled>3. Insert Data</button>
    <button onclick="testQuery()" id="btnQuery" disabled>4. Query Data</button>
    <button onclick="testClose()" id="btnClose" disabled>5. Close Database</button>
    <button onclick="runFullTest()" id="btnFull">▶ Run Full Test</button>
  </div>

  <div class="section">
    <h2>Output</h2>
    <div id="output" class="output">Waiting for plugin to load...</div>
  </div>

  <script src="./plugin-manager.js"></script>
  <script>
    let pluginManager;
    let dbOpen = false;

    function log(message, isError = false) {
      const output = document.getElementById('output');
      const timestamp = new Date().toLocaleTimeString();
      const className = isError ? 'error' : 'success';
      output.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
      output.scrollTop = output.scrollHeight;
    }

    function updateButtons() {
      document.getElementById('btnOpen').disabled = dbOpen;
      document.getElementById('btnCreate').disabled = !dbOpen;
      document.getElementById('btnInsert').disabled = !dbOpen;
      document.getElementById('btnQuery').disabled = !dbOpen;
      document.getElementById('btnClose').disabled = !dbOpen;
    }

    async function testOpen() {
      try {
        log('Opening database...');
        const result = await pluginManager.call('sql', 'open', '');
        const output = new TextDecoder().decode(result.output);
        log(`✓ Open result: ${output} (return code: ${result.returnCode})`);
        dbOpen = true;
        updateButtons();
      } catch (error) {
        log(`✗ Error: ${error.message}`, true);
      }
    }

    async function testCreateTable() {
      try {
        log('Creating table...');
        const sql = 'CREATE TABLE items (id INTEGER PRIMARY KEY, name TEXT, value INTEGER)';
        const result = await pluginManager.call('sql', 'exec', sql);
        const output = new TextDecoder().decode(result.output);
        log(`✓ Create table result: ${output}`);
      } catch (error) {
        log(`✗ Error: ${error.message}`, true);
      }
    }

    async function testInsert() {
      try {
        log('Inserting data...');

        const items = [
          "INSERT INTO items (name, value) VALUES ('sword', 100)",
          "INSERT INTO items (name, value) VALUES ('shield', 75)",
          "INSERT INTO items (name, value) VALUES ('potion', 25)",
          "INSERT INTO items (name, value) VALUES ('armor', 150)"
        ];

        for (const sql of items) {
          const result = await pluginManager.call('sql', 'exec', sql);
          const output = new TextDecoder().decode(result.output);
          log(`  ✓ Inserted: ${sql.match(/'([^']+)'/)[1]}`);
        }

        log('✓ All items inserted successfully');
      } catch (error) {
        log(`✗ Error: ${error.message}`, true);
      }
    }

    async function testQuery() {
      try {
        log('Querying data...');

        // Query all items
        log('\n--- Query: SELECT * FROM items ---');
        let result = await pluginManager.call('sql', 'query', 'SELECT * FROM items');
        let output = new TextDecoder().decode(result.output);
        log(output);

        // Query with WHERE clause
        log('\n--- Query: SELECT * FROM items WHERE value > 50 ---');
        result = await pluginManager.call('sql', 'query', 'SELECT * FROM items WHERE value > 50');
        output = new TextDecoder().decode(result.output);
        log(output);

        // Query with aggregation
        log('\n--- Query: SELECT COUNT(*), AVG(value) FROM items ---');
        result = await pluginManager.call('sql', 'query', 'SELECT COUNT(*) as count, AVG(value) as avg_value FROM items');
        output = new TextDecoder().decode(result.output);
        log(output);

        log('✓ All queries completed successfully');
      } catch (error) {
        log(`✗ Error: ${error.message}`, true);
      }
    }

    async function testClose() {
      try {
        log('Closing database...');
        const result = await pluginManager.call('sql', 'close', '');
        const output = new TextDecoder().decode(result.output);
        log(`✓ Close result: ${output}`);
        dbOpen = false;
        updateButtons();
      } catch (error) {
        log(`✗ Error: ${error.message}`, true);
      }
    }

    async function runFullTest() {
      document.getElementById('output').innerHTML = '';
      log('=== Starting Full SQL Plugin Test ===\n');

      await testOpen();
      await new Promise(r => setTimeout(r, 100));

      await testCreateTable();
      await new Promise(r => setTimeout(r, 100));

      await testInsert();
      await new Promise(r => setTimeout(r, 100));

      await testQuery();
      await new Promise(r => setTimeout(r, 100));

      await testClose();

      log('\n=== Test Complete ===');
    }

    // Initialize plugin manager
    async function init() {
      try {
        log('Initializing plugin manager...');

        pluginManager = await PluginManager.create({
          modules: [
            {name: 'sql', url: '/plugins/sql.wasm'}
          ],
          hostFunctions: []
        });

        log('✓ Plugin manager initialized');
        log('✓ SQL plugin loaded successfully\n');

        // Test info function
        const infoResult = await pluginManager.call('sql', 'info', '');
        const info = new TextDecoder().decode(infoResult.output);
        log(`Plugin info: ${info}\n`);

        document.getElementById('status').textContent = 'Ready';
        document.getElementById('status').className = 'status ready';
        document.getElementById('btnOpen').disabled = false;
        document.getElementById('btnFull').disabled = false;

        log('Ready to test! Click "Run Full Test" or use individual buttons.');
      } catch (error) {
        log(`✗ Failed to initialize: ${error.message}`, true);
        document.getElementById('status').textContent = 'Error: ' + error.message;
        document.getElementById('status').className = 'status error';
      }
    }

    // Start initialization
    init();
  </script>
</body>

</html>
