<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Radial vignette overlay -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a1520" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050a0f" stop-opacity="0.8"/>
    </radialGradient>
    <!-- Subtle grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0e2030" stroke-width="0.5"/>
    </pattern>
    <!-- Dot pattern for nodes -->
    <pattern id="dots" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="40" cy="40" r="1.5" fill="#00e5ff" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Base background -->
  <rect width="100%" height="100%" fill="#080e14"/>

  <!-- Grid underlay -->
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Dot nodes -->
  <rect width="100%" height="100%" fill="url(#dots)"/>

  <!-- Faint circuit traces -->
  <g stroke="#00e5ff" stroke-width="0.5" fill="none" opacity="0.06">
    <path d="M 100,300 L 200,300 L 200,200 L 350,200"/>
    <path d="M 450,200 L 600,200 L 600,350 L 700,350"/>
    <path d="M 300,400 L 300,500 L 500,500 L 500,400"/>
    <path d="M 150,100 L 250,100 L 250,150"/>
    <path d="M 550,450 L 650,450 L 650,500 L 750,500"/>
    <path d="M 50,200 L 50,400"/>
    <path d="M 750,100 L 750,250"/>
  </g>

  <!-- Faint connector dots at intersections -->
  <g fill="#00e5ff" opacity="0.1">
    <circle cx="200" cy="300" r="2"/>
    <circle cx="200" cy="200" r="2"/>
    <circle cx="350" cy="200" r="2"/>
    <circle cx="450" cy="200" r="2"/>
    <circle cx="600" cy="200" r="2"/>
    <circle cx="600" cy="350" r="2"/>
    <circle cx="700" cy="350" r="2"/>
    <circle cx="300" cy="400" r="2"/>
    <circle cx="300" cy="500" r="2"/>
    <circle cx="500" cy="500" r="2"/>
    <circle cx="500" cy="400" r="2"/>
  </g>

  <!-- Vignette overlay -->
  <rect width="100%" height="100%" fill="url(#vignette)"/>
</svg>
