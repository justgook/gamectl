<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Plugin Web Runner</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #111;
      color: #eee;
      font-family: sans-serif;
    }
    body {
      display: grid;
      grid-template-rows: auto 1fr;
    }
    #controls {
      display: flex;
      gap: 8px;
      padding: 8px;
      border-bottom: 1px solid #333;
    }
    button {
      border: 1px solid #444;
      background: #222;
      color: #eee;
      padding: 6px 10px;
      cursor: pointer;
    }
    #canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div id="controls">
    <button id="pause">Pause</button>
    <button id="reload">Reload</button>
  </div>
  <canvas id="canvas"></canvas>
  <script type="module">
    import { GLBridge } from './gl-bridge.js'

    const canvas = document.getElementById('canvas')
    const pauseBtn = document.getElementById('pause')
    const reloadBtn = document.getElementById('reload')

    let gl = null
    let bridge = null
    let instance = null
    let raf = 0
    let paused = false

    function resize() {
      const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 4))
      const w = Math.max(1, Math.floor(canvas.clientWidth * dpr))
      const h = Math.max(1, Math.floor(canvas.clientHeight * dpr))
      if (canvas.width !== w) canvas.width = w
      if (canvas.height !== h) canvas.height = h
      gl?.viewport(0, 0, w, h)
    }

    function startLoop() {
      const tick = () => {
        raf = requestAnimationFrame(tick)
        if (!paused) instance?.exports?.frame?.()
      }
      raf = requestAnimationFrame(tick)
    }

    function stopLoop() {
      if (raf) {
        cancelAnimationFrame(raf)
        raf = 0
      }
    }

    async function boot() {
      gl = canvas.getContext('webgl2', {
        alpha: false,
        depth: true,
        stencil: true,
        antialias: true,
        premultipliedAlpha: false,
        preserveDrawingBuffer: false,
      })
      if (!gl) throw new Error('WebGL2 not supported')

      resize()

      bridge = new GLBridge(gl, null)
      const wasmBytes = await fetch('./triangle.wasm').then(r => r.arrayBuffer())
      const importObject = {
        env: {
          js_canvas_width: () => canvas.width,
          js_canvas_height: () => canvas.height,
          js_webgl_framebuffer: () => 0,
          ...bridge.createImportObject(),
        },
      }

      const wasm = await WebAssembly.instantiate(wasmBytes, importObject)
      instance = wasm.instance
      bridge.memory = instance.exports.memory

      instance.exports.init()
      startLoop()
    }

    async function reload() {
      stopLoop()
      try { instance?.exports?.cleanup?.() } catch (_) {}
      instance = null
      await boot()
    }

    pauseBtn.addEventListener('click', () => {
      paused = !paused
      pauseBtn.textContent = paused ? 'Resume' : 'Pause'
    })
    reloadBtn.addEventListener('click', () => { reload().catch(console.error) })

    new ResizeObserver(resize).observe(canvas)
    window.addEventListener('resize', resize)

    boot().catch((err) => {
      console.error(err)
      alert(err.message)
    })
  </script>
</body>
</html>
