  <script>
    const mb32 = a => (t) => (a = a + 1831565813 | 0, t = Math.imul(a ^ a >>> 15, 1 | a), t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t, (t ^ t >>> 14) >>> 0) / 2 ** 32;

    class TileGrid {
      // Door bit masks for NESW (North, East, South, West)
      static DOORS = {
        NORTH: 1,  // 0001
        EAST: 2,  // 0010
        SOUTH: 4,  // 0100
        WEST: 8   // 1000
      };
      constructor() {
        this.grid = new Map();
      }

      // Helper to create coordinate key
      _getKey(x, y) {
        return `${x}_${y}`;
      }

      // Add a new tile with specified doors
      addTile(x, y, doors = 0) {
        const key = this._getKey(x, y);
        this.grid.set(key, doors);
        return this;
      }

      // Get tile doors (returns 0 if tile doesn't exist)
      getTile(x, y) {
        const key = this._getKey(x, y);
        return this.grid.get(key) || 0;
      }

      // Add door(s) to existing tile
      addDoor(x, y, door) {
        const key = this._getKey(x, y);
        const currentDoors = this.grid.get(key) || 0;
        this.grid.set(key, currentDoors | door);
        return this;
      }

      // Remove door(s) from tile
      removeDoor(x, y, door) {
        const key = this._getKey(x, y);
        const currentDoors = this.grid.get(key) || 0;
        this.grid.set(key, currentDoors & ~door);
        return this;
      }

      // Check if tile has specific door
      hasDoor(x, y, door) {
        const doors = this.getTile(x, y);
        return (doors & door) !== 0;
      }

      // Remove tile completely
      removeTile(x, y) {
        const key = this._getKey(x, y);
        return this.grid.delete(key);
      }

      // Get all tiles as array of {x, y, doors}
      getAllTiles() {
        const tiles = [];
        for (const [key, doors] of this.grid) {
          const [x, y] = key.split('_').map(Number);
          tiles.push({x, y, doors});
        }
        return tiles;
      }

    }

    class Graph {
      constructor(directed = true) {
        this.nodes = new Map()
        this.external = new Map()
        this.directed = directed
      }

      traverse(node, fn = (a) => console.log("Visiting:", a), visited = new Set()) {
        visited.add(node)
        fn(node)
        const neighbors = this.getNeighbors(node)
        for (const [neighbor] of neighbors.entries()) {
          if (visited.has(neighbor)) continue // Avoid cycles or revisits
          this.traverse(neighbor, fn, visited)
        }
      }

      addNode(node) {
        if (!this.nodes.has(node)) {
          this.nodes.set(node, new Map())
        }
      }

      getRandomNode(rand = mb32(42)) {
        const keys = Array.from(this.nodes.keys())
        const randomIndex = Math.floor(rand() * keys.length)

        return keys[randomIndex]
      }

      addEdge(from, to, {name, external} = {name: "", external: false}) {
        if (external) {
          if (!this.external.has(from)) this.external.set(from, new Map())
          this.external.get(from).set(to, name)

          return
        }

        if (!this.nodes.has(from)) this.addNode(from)
        this.nodes.get(from).set(to, name)
      }

      getNeighbors(node) {
        return this.nodes.get(node) || new Map()
      }

      getExNeighbors(node) {
        const inputKeys = new Map()
        for (const [key, valueMap] of this.external.entries()) {
          if (!valueMap.has(node)) continue
          inputKeys.set(key, valueMap.get(node))
        }

        return [inputKeys, this.external.get(node) || new Map()]
      }

      toMermaid(definitions = new Map(), direction = "LR") {
        return [`graph ${direction}`, this.toMermaidSubgraph(definitions)].join("\n")
      }

      toMermaidSubgraph(definitions = new Map(), nodes = this.nodes) {
        const lines = []
        for (const [key, val] of definitions) {
          lines.push(`  ${key}["${val}"]`)
        }

        for (const [from, neighbors] of nodes.entries()) {
          for (const [to, edgeName] of neighbors.entries()) {
            if (this.directed || from < to) {
              lines.push(`  ${from}${edgeName === "" ? " --> " : (" -->|" + edgeName + "|")}${to}`)
            }
          }
        }

        return lines.join("\n")
      }
    }

  <script>
    class PathCarver {
      constructor(wallMap) {
        this.wallMap = wallMap; // Map contains only walls/blockers
      }

      // Parse coordinate string "x_y" to [x, y]
      parseCoord(coordStr) {
        const [x, y] = coordStr.split('_').map(Number);
        return [x, y];
      }

      // Convert [x, y] to coordinate string "x_y"
      coordToString(x, y) {
        return `${x}_${y}`;
      }

      // Check if coordinate is blocked by a wall
      isBlocked(coordStr) {
        return this.wallMap.has(coordStr);
      }

      // Get neighboring coordinates (4-directional only) that are not blocked
      getAccessibleNeighbors(coordStr) {
        const [x, y] = this.parseCoord(coordStr);
        const neighbors = [];

        const directions = [[-1, 0], [1, 0], [0, -1], [0, 1]] // TODO: shuffle before use

        for (const [dx, dy] of directions) {
          const newCoord = this.coordToString(x + dx, y + dy);
          if (!this.isBlocked(newCoord)) { // Only add if NOT blocked
            neighbors.push(newCoord);
          }
        }

        return neighbors;
      }

      // Dijkstra's algorithm for carving path through open space
      carvePath(startCoord, pathCallback, options = {}) {
        const {maxPathLength = Infinity, validationCallback = null} = options;

        // No need to check if start exists in wallMap - we're carving through empty space
        if (this.isBlocked(startCoord)) {
          throw new Error('Cannot start path carving from a blocked position (wall)');
        }

        const distances = new Map();
        const previous = new Map();
        const unvisited = new Set();

        // Initialize with start position
        distances.set(startCoord, 0);
        unvisited.add(startCoord);

        let endCoord = null;

        // Check if start position already satisfies end condition
        const [startX, startY] = this.parseCoord(startCoord);
        const wallValue = this.wallMap.get(startCoord); // Will be undefined for open space

        const startResult = pathCallback({
          from: null, // No previous position for start
          to: {
            coord: startCoord,
            x: startX,
            y: startY,
            isBlocked: false,
            wallValue: wallValue
          },
          pathLength: 0,
          totalCost: 0
        });

        if (startResult.isEnd) {
          return {
            path: [startCoord],
            totalCost: 0,
            steps: 0,
            endReason: 'start_is_end'
          };
        }

        while (unvisited.size > 0) {
          // Find unvisited node with minimum distance
          let current = null;
          let minDistance = Infinity;

          for (const coord of unvisited) {
            const dist = distances.get(coord);
            if (dist < minDistance) {
              minDistance = dist;
              current = coord;
            }
          }

          if (current === null || minDistance === Infinity) {
            break; // No more reachable nodes
          }

          unvisited.delete(current);

          // Check path length limit
          const currentPathLength = this.getPathLength(current, previous);
          if (currentPathLength >= maxPathLength) {
            continue; // Skip nodes that would exceed max path length
          }

          // Check all accessible neighbors (not blocked by walls)
          const neighbors = this.getAccessibleNeighbors(current);

          for (const neighbor of neighbors) {
            const [currentX, currentY] = this.parseCoord(current);
            const [neighborX, neighborY] = this.parseCoord(neighbor);

            const neighborPathLength = currentPathLength + 1;

            // Skip if this would exceed max path length
            if (neighborPathLength > maxPathLength) {
              continue;
            }

            const currentWallValue = this.wallMap.get(current);
            const neighborWallValue = this.wallMap.get(neighbor);

            // Reconstruct current path for validation callback
            const currentPath = this.reconstructPath(current, previous);

            const moveData = {
              from: {
                coord: current,
                x: currentX,
                y: currentY,
                isBlocked: false,
                wallValue: currentWallValue
              },
              to: {
                coord: neighbor,
                x: neighborX,
                y: neighborY,
                isBlocked: false,
                wallValue: neighborWallValue
              },
              pathLength: neighborPathLength,
              totalCost: distances.get(current),
              currentPath: currentPath, // Path from start to current position
              proposedPath: [...currentPath, neighbor] // Path including the proposed move
            };

            // Check validation callback first - if move is invalid, skip this neighbor entirely
            if (validationCallback && !validationCallback(moveData)) {
              continue; // Skip this neighbor, but continue with other neighbors
            }

            // Calculate cost and check end condition using the callback
            const callbackResult = pathCallback(moveData);
            const moveCost = callbackResult.cost;
            const newDistance = distances.get(current) + moveCost;

            // Update distance if we found a better path
            if (!distances.has(neighbor) || newDistance < distances.get(neighbor)) {
              distances.set(neighbor, newDistance);
              previous.set(neighbor, current);

              if (!unvisited.has(neighbor)) {
                unvisited.add(neighbor);
              }
            }

            // Check if this neighbor is our end point
            if (callbackResult.isEnd) {
              endCoord = neighbor;
              // Continue to finish processing this iteration to ensure we have the shortest path
            }
          }

          // If we found an end, we can stop after processing all neighbors of current
          if (endCoord !== null) {
            break;
          }
        }

        // Determine end reason and result
        if (endCoord === null) {
          return {
            path: null,
            totalCost: null,
            steps: null,
            endReason: unvisited.size === 0 ? 'no_accessible_path' : 'max_length_reached'
          };
        }

        // Reconstruct path
        const path = this.reconstructPath(endCoord, previous);

        return {
          path,
          totalCost: distances.get(endCoord),
          steps: path.length - 1,
          endReason: 'end_condition_met'
        }
      }

      // Helper method to reconstruct path from start to given coordinate
      reconstructPath(coord, previous) {
        const path = [];
        let current = coord;

        while (current !== undefined) {
          path.unshift(current);
          current = previous.get(current);
        }

        return path;
      }

      // Helper method to calculate current path length by tracing back through previous
      getPathLength(coord, previous) {
        let length = 0;
        let current = coord;

        while (previous.has(current)) {
          length++;
          current = previous.get(current);
        }

        return length;
      }
    }

  <script>
    function getMapBounds(map) {
      let Infinity, minY = Infinity
      let maxX = -Infinity, maxY = -Infinity

      for (const key of map.keys()) {
        const [x, y] = key.split('_').map(Number);
        minX = Math.min(minX, x);
        minY = Math.min(minY, y);
        maxX = Math.max(maxX, x);
        maxY = Math.max(maxY, y);
      }

      return {minX, maxX, minY, maxY};
    }

    function hasPathToFreeSpace(startX, startY, map) { // TODO accept as artgument `queue` instead of startX,startY
      function key(x, y) {
        return `${x}_${y}`
      }
      const bounds = getMapBounds(map)
      const visited = new Set()
      const queue = [[startX, startY]]

      const directions = [
        [0, -1], // up
        [0, 1],  // down
        [-1, 0], // left
        [1, 0],  // right
      ]

      while (queue.length > 0) {
        const [x, y] = queue.shift()
        const k = key(x, y)
        if (visited.has(k)) continue
        visited.add(k)

        // If this cell is outside bounds, it's free space
        if (
          x < bounds.minX || x > bounds.maxX ||
          y < bounds.minY || y > bounds.maxY
        ) {
          return true
        }

        for (const [dx, dy] of directions) {
          const nx = x + dx
          const ny = y + dy
          const nk = key(nx, ny)

          if (!map.has(nk)) {
            // It's not occupied — could be free space or might lead to it
            queue.push([nx, ny])
          }
        }
      }

      return false
    }

    function shuffle(input = [], rand = myRand) {
      const middle = input.slice(1, -1);

      for (let i = middle.length - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1));
        [middle[i], middle[j]] = [middle[j], middle[i]];
      }

      return [input[0], ...middle, input[input.length - 1]]
    }


    function buildProgressionGraph(
      biomes = ["Start", "Caves", "Ruins", "Tower", "Lab", "Depths"],
      keys = ["DoubleJump", "KeyA", "KeyB", "Fireball"],
      rand = myRand
    ) {
      // const biomes = shuffle(biomes_, rand) //TODO: shuffle before passing in
      const graph = new Graph(false)
      const currentKeys = new Set()
      const keyLocation = new Map()
      const entrances = new Map()
      const exits = new Map()
      const result = new Graph()
      const names = new Map()

      for (let i = 0; i < biomes.length - 1; i++) {
        let from = biomes[i]
        let to = biomes[i + 1]

        // STEP 1: (optional) place a key in this biome
        function keyCountToPlace(biomesLeft, keysLeft, rand = myRand) {
          const minKeys = Math.floor(keysLeft / biomesLeft)
          let keysToPlace = minKeys
          const extraChance = (keysLeft / biomesLeft) - minKeys
          if (rand() < extraChance) keysToPlace++
          keysToPlace = Math.min(keysToPlace, keysLeft)
          return keysToPlace
        }

        const availableKeys = keys.filter(k => !keyLocation.has(k))
        if (availableKeys.length > 0) {
          const biomesLeft = biomes.length - 1 - i // remaining biomes that CAN have keys
          const keysLeft = availableKeys.length
          const keysToPlace = keyCountToPlace(biomesLeft, keysLeft, rand)

          const chosenKeys = []
          for (let i = 0; i < keysToPlace; i++) {
            const index = Math.floor(rand() * availableKeys.length)
            const chosenKey = availableKeys[index]
            availableKeys.splice(index, 1)
            keyLocation.set(chosenKey, from)
            currentKeys.add(chosenKey)
            chosenKeys.push(chosenKey)
          }

          names.set(from, `${from} (${chosenKeys.join(", ")})`)
        }

        // STEP 2: Decide if access to next biome is locked
        let required = new Set()
        if (i === biomes.length - 2) {// if it is last biome set all keys as needed!
          required = currentKeys
        } else if (currentKeys.size > 0 && rand() < 0.7) {
          const keysArray = [...currentKeys]
          const keyCount = Math.floor(rand() * Math.min(2, keysArray.length)) + 1
          while (required.size < keyCount) {
            required.add(keysArray[Math.floor(rand() * keysArray.length)])
          }
        }

        // STEP 3: Add nodes and edges to graph 
        result.addNode(from)
        const targetNode = result.getRandomNode(rand)
        result.addNode(to)
        result.addEdge(targetNode, to, {name: [...required].join(", ")})
        newOrGet(exits, targetNode, new Map()).set(to, required)
        newOrGet(entrances, to, new Map()).set(targetNode, required)
      }

      const invertedMap = new Map()
      for (const [key, value] of keyLocation.entries()) {
        if (!invertedMap.has(value)) {
          invertedMap.set(value, [])
        }
        invertedMap.get(value).push(key)
      }

      return [result, names, invertedMap, entrances, exits]
    }

        const validationCallback = (moveData) => {
          console.log("validationCallback, early exit?")
          const thePath = moveData.proposedPath.map((a) => a.split("_").map(Number))
          return this.hasFreePathFrom(thePath)
        }

        return this.pathFinder.carvePath(`${startX}_${startY}`, cb, {maxPathLength: 32, validationCallback})
      }

      getUnblockedNeighbors(input) {
        const allPositions = this.getNeighbors(input)
        const exclude = this.cantPlace(allPositions)
        return allPositions.filter(
          ([x1, y1]) => !exclude.some(([x2, y2]) => x1 === x2 && y1 === y2)
        )
      }

      cantPlace(positions) {
        const output = []
        for (const p of positions) {
          if (this.grid.has(`${p[0]}_${p[1]}`)) {
            output.push(p)
          }
        }
        return output
      }

      markOccupied(positions, roomId, doors = 0) {
        if (!this.rooms.has(roomId)) {
          this.rooms.set(roomId, new Set())
        }

        const currenRoom = this.rooms.get(roomId)
        for (const [x, y] of positions) {
          this.grid.set(`${x}_${y}`, roomId)
          currenRoom.add(`${x}_${y}`)
        }
      }

      hasRoom([x, y]) {
        return this.grid.get(`${x}_${y}`)
      }

      getNeighbors(pos) {
        const output = []
        for (const [x, y] of pos) {
          output.push([x, y - 1], [x + 1, y], [x, y + 1], [x - 1, y])
        }

        return output
      }

      hasFreePathFrom(newTile = [[0, 0]]) {
        // TODO: collect all doors without room, and check can they reach outside
        const map = new Set(this.grid.keys())
        map.add(newTile)
        // hasPathToFreeSpace()
        return true
      }

      toAbs(tiles, [startX, startY]) {
        return tiles.map(([x, y]) => [x + startX, y + startY])
      }
    }


    function planNextBlob(ctx, entryPoint, entryNode, graph, openEnds = [], rand = myRand) {
      const startPoints = new Map([[entryNode, entryPoint]])
      const parentNodes = new Map()

      function work(node) {
        const parent = parentNodes.get(node)
        let point = startPoints.get(node)

        console.log("working on", node)
        const room = ctx.getRoom(node)
        let roomAbs = ctx.toAbs(room, point)

        // Find best place for room
        const roomPlace = ctx.findRoomPlace(room, point)
        const roomAdditionalPath = roomPlace.path.map((a) => a.split("_").map(Number))

        const wasPoint = point
        point = roomAdditionalPath.pop() // last point of path is starting point of room
        roomAbs = ctx.toAbs(room, point)
        ctx.markOccupied(roomAbs, node)

        // Move door location
        if (roomAdditionalPath.length) {
          // Removing old doors
          let parenAbs = [...ctx.rooms.get(parent)].map((a) => a.split("_").map(Number));
          let doors = findDoorDirection(parenAbs, roomAdditionalPath[0])
          ctx.doorGrid.removeDoor(...doors.exit)
          ctx.doorGrid.removeDoor(...doors.entrance)

          // updating parent room
          ctx.markOccupied(roomAdditionalPath, parent)

          // adding new doors
          parenAbs = [...ctx.rooms.get(parent)].map((a) => a.split("_").map(Number));
          doors = findDoorDirection(parenAbs, point)
          ctx.doorGrid.addDoor(...doors.exit)
          ctx.doorGrid.addDoor(...doors.entrance)
        }

        let neighbors = graph.getNeighbors(node)
        let exNeighbors = graph.getExNeighbors(node)
        console.log(exNeighbors)

        // Add random nodes until we have enough exits for room
        let haveExits = ctx.getUnblockedNeighbors(roomAbs)
        while (neighbors.size > haveExits.length) {
          let newTile = haveExits.pluck()
          while (!ctx.hasFreePathFrom([newTile])) {
            newTile = haveExits.pluck()
          }
          roomAbs.push(newTile)
          ctx.markOccupied(roomAbs, node)
          haveExits = ctx.getUnblockedNeighbors(roomAbs)
        }

        // Set Doors (starting point) for all neighbors of current node
        for (const [neighbor] of neighbors) {
          parentNodes.set(neighbor, node)
          const startPoint = haveExits.pluck()
          startPoints.set(neighbor, startPoint)
          const {exit, entrance} = findDoorDirection(roomAbs, startPoint)
          ctx.doorGrid.addDoor(...exit)
          ctx.doorGrid.addDoor(...entrance)
        }
      }

      graph.traverse(entryNode, work)
    }

    myRand() // TODO: remove rand incrementer

    const minimap = new MinimapGenerationContext()
    planNextBlob(minimap, [0, 0], "Start-RuneStone", biomesGraps.get("Start"))

    /// TMP RENDER
    function adjustCoordinateMapMinMax(coordMap) {
      // Find minimum x and y values
      let minX = Infinity;
      let minY = Infinity;

      for (const key of coordMap.keys()) {
        const [x, y] = key.split('_').map(Number);
        minX = Math.min(minX, x);
        minY = Math.min(minY, y);
      }

      return [minX, minY]
    }

    function adjustCoordinateMap(coordMap, [minX, minY] = [0, 0]) {
      if (!(coordMap instanceof Map)) return new Map();
      if (coordMap.size === 0) return new Map(coordMap);

      if (!minX || !minY) {
        [minX, minY] = adjustCoordinateMapMinMax(coordMap)
      }

      // If no negative values, return copy of original map
      if (minX >= 0 && minY >= 0) return new Map(coordMap);

      // Calculate shift amounts
      const shiftX = minX < 0 ? -minX : 0;
      const shiftY = minY < 0 ? -minY : 0;

      // Create new adjusted map
      const adjustedMap = new Map();

      for (const [key, value] of coordMap.entries()) {
        const [x, y] = key.split('_').map(Number);
        const newKey = `${x + shiftX}_${y + shiftY}`;
        adjustedMap.set(newKey, value);
      }

      return adjustedMap
    }

    function renderGrid(map, ctx, getColor = (a) => a, cellSize = 20) {
      for (const [key, value] of map.entries()) {
        const [x, y] = key.split('_').map(Number)
        ctx.fillStyle = getColor(value)
        ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize)
      }
    }

    function renderGridDoors(map, ctx, cellSize = 20) {

      function drawDoor(x, y, a = 0, doorRadius = cellSize * 0.25) {
        ctx.beginPath()
        ctx.arc(x, y, doorRadius, Math.PI * a, (1 + a) * Math.PI)
        ctx.fill()
      }

      for (const [key, doors] of map.entries()) {
        const [x, y] = key.split('_').map(Number)
        const rectX = x * cellSize;
        const rectY = y * cellSize;
        // ctx.strokeStyle = "#000000"
        // ctx.lineWidth = 2
        // ctx.strokeRect(rectX, rectY, cellSize, cellSize);

        if (!doors) continue
        ctx.fillStyle = "#CCCCCC"
        if (doors & TileGrid.DOORS.NORTH) drawDoor(rectX + cellSize / 2, rectY)
        if (doors & TileGrid.DOORS.EAST) drawDoor(rectX + cellSize, rectY + cellSize / 2, 0.5)
        if (doors & TileGrid.DOORS.SOUTH) drawDoor(rectX + cellSize / 2, rectY + cellSize, 1)
        if (doors & TileGrid.DOORS.WEST) drawDoor(rectX, rectY + cellSize / 2, 1.5)
      }
    }

    const adjOpt = adjustCoordinateMapMinMax(minimap.grid)
    renderGrid(adjustCoordinateMap(minimap.grid, adjOpt), canvas.getContext('2d'), stringToColorHSL)
    renderGridDoors(adjustCoordinateMap(minimap.doorGrid.grid, adjOpt), canvas.getContext('2d'))


    ///// UTILS
    function findDoorDirection(existingRoom, newTile) {
      const [newX, newY] = newTile
      const directions = {
        '0,-1': TileGrid.DOORS.NORTH,
        '0,1': TileGrid.DOORS.SOUTH,
        '1,0': TileGrid.DOORS.EAST,
        '-1,0': TileGrid.DOORS.WEST,
      }
      const oppositeDirections = {
        [TileGrid.DOORS.NORTH]: TileGrid.DOORS.SOUTH,
        [TileGrid.DOORS.SOUTH]: TileGrid.DOORS.NORTH,
        [TileGrid.DOORS.EAST]: TileGrid.DOORS.WEST,
        [TileGrid.DOORS.WEST]: TileGrid.DOORS.EAST
      };

      for (const [roomX, roomY] of existingRoom) {
        const dx = newX - roomX
        const dy = newY - roomY
        const directionKey = `${dx},${dy}`;

        // Check if tiles are adjacent (Manhattan distance = 1)
        if (Math.abs(dx) + Math.abs(dy) === 1) {
          const exitDirection = directions[directionKey]
          const entranceDirection = oppositeDirections[exitDirection]

          return {
            exit: [roomX, roomY, exitDirection],
            entrance: [newX, newY, entranceDirection],
          }
        }
      }

      throw new Error("No adjacent tiles found")
    }


    /**
     * Converts a string to a consistent hex color using hash-based generation
     * @param {string} str - Input string to convert to color
     * @returns {string} - Hex color string (e.g., '#FF5733')
     */
    function stringToColor(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = str.charCodeAt(i) + ((hash << 5) - hash);
      }

      // Convert hash to hex color
      const color = (hash & 0x00FFFFFF).toString(16).toUpperCase();
      return '#' + '00000'.substring(0, 6 - color.length) + color;
    }

    /**
     * Converts a string to a consistent HSL color with good distribution
     * @param {string} str - Input string to convert to color
     * @returns {string} - HSL color string (e.g., 'hsl(180, 70%, 55%)')
     */
    function stringToColorHSL(str) {
      // str = str.split("").reverse().join("")
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = str.charCodeAt(i) + ((hash << 5) - hash);
      }

      const hue = Math.abs(hash) % 360;
      const saturation = 60 + (Math.abs(hash) % 40); // 60-100%
      const lightness = 45 + (Math.abs(hash) % 20);  // 45-65%

      return `hsl(${hue}, ${saturation}%, ${lightness}%)`;
    }
